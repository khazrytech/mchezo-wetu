<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Admin Portal</title>
    <style>
        :root {
            --bg-deep: #030712;
            --card-glass: rgba(17, 24, 39, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary: #2563eb;
            --accent: #10b981;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(37, 99, 235, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.1) 0%, transparent 60%);
            color: var(--text-main);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .portal-card {
            background: var(--card-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%; max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .brand-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(37, 99, 235, 0.1); border: 1px solid rgba(37, 99, 235, 0.25);
            color: #60a5fa; padding: 6px 14px; border-radius: 20px;
            font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .input-group { margin-bottom: 16px; }
        .input-label {
            font-size: 11px; font-weight: 800; color: var(--text-muted);
            letter-spacing: 0.5px; margin-bottom: 6px; display: block;
            text-transform: uppercase;
        }
        .input-field {
            width: 100%; padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 14px; color: #fff;
            font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .input-field:focus { border-color: var(--primary); }
        .btn-action {
            width: 100%; padding: 14px;
            background: var(--primary); color: white;
            border: none; border-radius: 14px;
            font-size: 14px; font-weight: 800; cursor: pointer;
            margin-top: 10px; transition: background 0.2s, transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-action:active { transform: scale(0.98); }
        .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Modern Fintech Spinner Loader */
        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #initialLoader {
            padding: 40px 0; text-align: center;
        }
        .skeleton-spinner {
            width: 42px; height: 42px;
            border: 4px solid rgba(37, 99, 235, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(31, 41, 55, 0.95); color: #fff; padding: 12px 24px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15); font-size: 13px; font-weight: 700;
            z-index: 3000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; backdrop-filter: blur(10px);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="toast">✅ Taarifa</div>

    <div class="portal-card">
        <div style="text-align: center;">
            <div class="brand-badge">● MCHEZO WETU FINTECH</div>
            <h2 id="portalHeading" style="font-size: 22px; font-weight: 900; margin: 0 0 6px 0; color: #fff;"></h2>
            <p id="portalSubheading" style="font-size: 12px; color: var(--text-muted); margin: 0 0 24px 0;"></p>
        </div>

        <!-- INITIAL PRO FINTECH LOADER (BILA MANENO YA KAWAIDA) -->
        <div id="initialLoader">
            <div class="skeleton-spinner"></div>
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase;">Inahakiki Mfumo...</span>
        </div>

        <!-- FORM 1: USAJILI WA ADMIN -->
        <form id="signupForm" style="display: none;" onsubmit="handleAdminSignup(event)">
            <div class="input-group">
                <label class="input-label">Jina Kamili la Admin</label>
                <input type="text" id="regFullName" class="input-field" placeholder="Mfano: Msimamizi Mkuu" required>
            </div>
            <div class="input-group">
                <label class="input-label">Barua Pepe (Email ya Kuatumiwa OTP)</label>
                <input type="email" id="regEmail" class="input-field" placeholder="admin@example.com" required>
            </div>
            <div class="input-group">
                <label class="input-label">Namba ya Simu</label>
                <input type="tel" id="regPhone" class="input-field" placeholder="07XXXXXXXX">
            </div>
            <div class="input-group">
                <label class="input-label">Nenosiri (Password)</label>
                <input type="password" id="regPassword" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btnSignup" class="btn-action">
                <span>Jisajili & Tuma OTP kwa Email ➔</span>
            </button>
        </form>

        <!-- FORM 2: LOGIN YA ADMIN -->
        <form id="loginForm" style="display: none;" onsubmit="handleAdminLogin(event)">
            <div class="input-group">
                <label class="input-label">Email au Namba ya Simu</label>
                <input type="text" id="loginIdentifier" class="input-field" placeholder="Ingiza Email au Simu" required>
            </div>
            <div class="input-group">
                <label class="input-label">Nenosiri (Password)</label>
                <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btnLogin" class="btn-action">
                <span>Ingia & Tuma OTP kwa Email ➔</span>
            </button>
        </form>

        <!-- FORM 3: UTHIBITISHO WA EMAIL OTP -->
        <form id="otpForm" style="display: none;" onsubmit="handleVerifyOtp(event)">
            <div class="input-group" style="text-align: center;">
                <label class="input-label">Ingiza Tarakimu 6 za OTP Zilizotumwa Kwenye Email</label>
                <input type="number" id="otpInput" class="input-field" placeholder="123456" style="text-align: center; font-size: 22px; letter-spacing: 6px; font-weight: 800;" required>
            </div>
            <button type="submit" id="btnOtp" class="btn-action" style="background: var(--accent);">
                <span>Thibitisha & Ingia ➔</span>
            </button>
        </form>
    </div>

    <script>
        let currentEmail = '';
        let currentMode = '';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function setBtnLoading(btnId, isLoading, text) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<div class="spinner"></div> <span>${text}</span>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = `<span>${text}</span>`;
            }
        }

        async function checkAdminStatus() {
            try {
                const res = await fetch('/api/admin/check-exists');
                const data = await res.json();
                
                document.getElementById('initialLoader').style.display = 'none';

                if (data.exists) {
                    document.getElementById('portalHeading').innerText = 'Kuingia Msimamizi';
                    document.getElementById('portalSubheading').innerText = 'Ingiza taarifa zako za utawala kupokea OTP kwenye Email';
                    document.getElementById('loginForm').style.display = 'block';
                } else {
                    document.getElementById('portalHeading').innerText = 'Usajili wa Msimamizi Mkuu';
                    document.getElementById('portalSubheading').innerText = 'Tengeneza akaunti ya Admin ya mara ya kwanza';
                    document.getElementById('signupForm').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('initialLoader').style.display = 'none';
                showToast('⚠️ Imeshindikana kuangalia hali ya Admin.');
            }
        }

        async function handleAdminSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            setBtnLoading('btnSignup', true, 'Inasindika & Kutuma OTP...');

            try {
                const res = await fetch('/api/admin/register-send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phone, email, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentEmail = data.email;
                    currentMode = 'REGISTER';
                    document.getElementById('signupForm').style.display = 'none';
                    document.getElementById('otpForm').style.display = 'block';
                    document.getElementById('portalHeading').innerText = 'Thibitisha Email OTP';
                    document.getElementById('portalSubheading').innerText = 'OTP imetumwa kwenye barua pepe: ' + data.email;
                    showToast('📧 OTP imetumwa kwenye Email yako!');
                } else {
                    showToast('⚠️ ' + data.message);
                    setBtnLoading('btnSignup', false, 'Jisajili & Tuma OTP kwa Email ➔');
                }
            } catch (err) {
                showToast('⚠️ Imeshindikana kutuma OTP.');
                setBtnLoading('btnSignup', false, 'Jisajili & Tuma OTP kwa Email ➔');
            }
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            setBtnLoading('btnLogin', true, 'Inathibitisha...');

            try {
                const res = await fetch('/api/admin/login-send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (data.success) {
                    currentEmail = data.email;
                    currentMode = 'LOGIN';
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('otpForm').style.display = 'block';
                    document.getElementById('portalHeading').innerText = 'Thibitisha Email OTP';
                    document.getElementById('portalSubheading').innerText = 'OTP imetumwa kwenye barua pepe: ' + data.email;
                    showToast('📧 OTP imetumwa kwenye Email yako!');
                } else {
                    showToast('⚠️ ' + data.message);
                    setBtnLoading('btnLogin', false, 'Ingia & Tuma OTP kwa Email ➔');
                }
            } catch (err) {
                showToast('⚠️ Taarifa si sahihi.');
                setBtnLoading('btnLogin', false, 'Ingia & Tuma OTP kwa Email ➔');
            }
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();
            const otp = document.getElementById('otpInput').value.trim();
            const endpoint = currentMode === 'REGISTER' ? '/api/admin/register-verify-otp' : '/api/admin/login-verify-otp';

            setBtnLoading('btnOtp', true, 'Inahakiki OTP...');

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('adminToken', 'MW-ADMIN-AUTHENTICATED');
                    showToast('✅ Imethibitishwa rasmi!');
                    setTimeout(() => { window.location.href = '/admin.html'; }, 1000);
                } else {
                    showToast('⚠️ ' + data.message);
                    setBtnLoading('btnOtp', false, 'Thibitisha & Ingia ➔');
                }
            } catch (err) {
                showToast('⚠️ Verification imefeli.');
                setBtnLoading('btnOtp', false, 'Thibitisha & Ingia ➔');
            }
        }

        checkAdminStatus();
    </script>
</body>
</html>
