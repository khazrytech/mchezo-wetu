<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Admin Portal</title>
    <style>
        :root {
            --bg-deep: #020617;
            --card-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.4);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.25) 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.18) 0%, transparent 60%);
            color: var(--text-main);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .portal-card {
            background: var(--card-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 40px rgba(37, 99, 235, 0.12);
        }
        .brand-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(37, 99, 235, 0.12); border: 1px solid rgba(37, 99, 235, 0.3);
            color: #60a5fa; padding: 6px 16px; border-radius: 20px;
            font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
            margin-bottom: 20px;
        }
        .input-group { margin-bottom: 18px; }
        .input-label {
            font-size: 11px; font-weight: 800; color: var(--text-muted);
            letter-spacing: 0.6px; margin-bottom: 8px; display: block;
            text-transform: uppercase;
        }
        .input-field {
            width: 100%; padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 16px; color: #fff;
            font-size: 14px; outline: none; transition: all 0.25s ease;
        }
        .input-field:focus { 
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-action {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; border-radius: 16px;
            font-size: 14px; font-weight: 800; cursor: pointer;
            margin-top: 12px; transition: all 0.2s ease;
            box-shadow: 0 8px 20px var(--primary-glow);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-action:hover { transform: translateY(-1px); }
        .btn-action:active { transform: translateY(1px); }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* Sleek Modern Fintech Spinner */
        .btn-spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Initial Glow Ring Loader */
        #initRing {
            padding: 30px 0; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .glowing-ring {
            width: 48px; height: 48px; border-radius: 50%;
            border: 3px solid rgba(37, 99, 235, 0.2);
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(15, 23, 42, 0.95); color: #fff; padding: 14px 28px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15); font-size: 13px; font-weight: 700;
            z-index: 3000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="toast">✅ Notification</div>

    <div class="portal-card">
        <div style="text-align: center;">
            <div class="brand-badge">● MCHEZO WETU FINTECH</div>
            <h2 id="portalHeading" style="font-size: 22px; font-weight: 900; margin: 0 0 6px 0; color: #fff;"></h2>
            <p id="portalSubheading" style="font-size: 12px; color: var(--text-muted); margin: 0 0 24px 0;"></p>
        </div>

        <!-- SKELETON LOADER RING -->
        <div id="initRing">
            <div class="glowing-ring"></div>
        </div>

        <!-- FORM 1: USAJILI WA ADMIN -->
        <form id="signupForm" style="display: none;" onsubmit="handleAdminSignup(event)">
            <div class="input-group">
                <label class="input-label">Jina Kamili la Admin</label>
                <input type="text" id="regFullName" class="input-field" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <label class="input-label">Barua Pepe (Email ya OTP)</label>
                <input type="email" id="regEmail" class="input-field" placeholder="admin@example.com" required>
            </div>
            <div class="input-group">
                <label class="input-label">Namba ya Simu</label>
                <input type="tel" id="regPhone" class="input-field" placeholder="07XXXXXXXX">
            </div>
            <div class="input-group">
                <label class="input-label">Nenosiri (Password)</label>
                <input type="password" id="regPassword" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btnSignup" class="btn-action">
                <span>Create Admin Account ➔</span>
            </button>
        </form>

        <!-- FORM 2: LOGIN YA ADMIN -->
        <form id="loginForm" style="display: none;" onsubmit="handleAdminLogin(event)">
            <div class="input-group">
                <label class="input-label">Email au Phone Number</label>
                <input type="text" id="loginIdentifier" class="input-field" placeholder="Email or Phone" required>
            </div>
            <div class="input-group">
                <label class="input-label">Nenosiri (Password)</label>
                <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btnLogin" class="btn-action">
                <span>Request OTP ➔</span>
            </button>
        </form>

        <!-- FORM 3: UTHIBITISHO WA EMAIL OTP -->
        <form id="otpForm" style="display: none;" onsubmit="handleVerifyOtp(event)">
            <div class="input-group" style="text-align: center;">
                <label class="input-label">Enter 6-Digit OTP Code</label>
                <input type="number" id="otpInput" class="input-field" placeholder="123456" style="text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: 900; background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.3);" required>
            </div>
            <button type="submit" id="btnOtp" class="btn-action" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px var(--accent-glow);">
                <span>Verify & Login ➔</span>
            </button>
        </form>
    </div>

    <script>
        let currentEmail = '';
        let currentMode = '';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function setBtnLoading(btnId, isLoading, defaultText) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<div class="btn-spinner"></div> <span>Sending OTP...</span>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = `<span>${defaultText}</span>`;
            }
        }

        async function checkAdminStatus() {
            try {
                const res = await fetch('/api/admin/check-exists');
                const data = await res.json();
                
                document.getElementById('initRing').style.display = 'none';

                if (data.exists) {
                    document.getElementById('portalHeading').innerText = 'Admin Login';
                    document.getElementById('portalSubheading').innerText = 'Ingiza taarifa zako za utawala kupokea OTP kwa Email';
                    document.getElementById('loginForm').style.display = 'block';
                } else {
                    document.getElementById('portalHeading').innerText = 'Admin Registration';
                    document.getElementById('portalSubheading').innerText = 'Tengeneza akaunti ya Admin ya mara ya kwanza';
                    document.getElementById('signupForm').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('initRing').style.display = 'none';
                showToast('⚠️ Imeshindikana kuangalia hali ya Admin.');
            }
        }

        async function handleAdminSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            setBtnLoading('btnSignup', true, 'Create Admin Account ➔');

            try {
                const res = await fetch('/api/admin/register-send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phone, email, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentEmail = data.email;
                    currentMode = 'REGISTER';
                    document.getElementById('signupForm').style.display = 'none';
                    document.getElementById('otpForm').style.display = 'block';
                    document.getElementById('portalHeading').innerText = 'Verify OTP Code';
                    document.getElementById('portalSubheading').innerText = 'Kodi imetumwa kwenye barua pepe: ' + data.email;
                    showToast('📧 OTP Code sent successfully!');
                } else {
                    showToast('⚠️ ' + data.message);
                    setBtnLoading('btnSignup', false, 'Create Admin Account ➔');
                }
            } catch (err) {
                showToast('⚠️ Failed to process request.');
                setBtnLoading('btnSignup', false, 'Create Admin Account ➔');
            }
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            setBtnLoading('btnLogin', true, 'Request OTP ➔');

            try {
                const res = await fetch('/api/admin/login-send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (data.success) {
                    currentEmail = data.email;
                    currentMode = 'LOGIN';
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('otpForm').style.display = 'block';
                    document.getElementById('portalHeading').innerText = 'Verify OTP Code';
                    document.getElementById('portalSubheading').innerText = 'Kodi imetumwa kwenye barua pepe: ' + data.email;
                    showToast('📧 OTP Code sent successfully!');
                } else {
                    showToast('⚠️ ' + data.message);
                    setBtnLoading('btnLogin', false, 'Request OTP ➔');
                }
            } catch (err) {
                showToast('⚠️ Credentials invalid.');
                setBtnLoading('btnLogin', false, 'Request OTP ➔');
            }
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();
            const otp = document.getElementById('otpInput').value.trim();
            const endpoint = currentMode === 'REGISTER' ? '/api/admin/register-verify-otp' : '/api/admin/login-verify-otp';

            const btn = document.getElementById('btnOtp');
            btn.disabled = true;
            btn.innerHTML = `<div class="btn-spinner"></div> <span>Verifying...</span>`;

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('adminToken', 'MW-ADMIN-AUTHENTICATED');
                    showToast('✅ Access Granted!');
                    setTimeout(() => { window.location.href = '/admin.html'; }, 1000);
                } else {
                    showToast('⚠️ ' + data.message);
                    btn.disabled = false;
                    btn.innerHTML = `<span>Verify & Login ➔</span>`;
                }
            } catch (err) {
                showToast('⚠️ Verification Failed.');
                btn.disabled = false;
                btn.innerHTML = `<span>Verify & Login ➔</span>`;
            }
        }

        checkAdminStatus();
    </script>
</body>
</html>
