<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Admin Portal</title>
    <style>
        :root {
            --bg-deep: #020617;
            --card-glass: rgba(15, 23, 42, 0.8);
            --border-glass: rgba(255, 255, 255, 0.1);
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.4);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.2) 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.15) 0%, transparent 60%);
            color: var(--text-main);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .portal-card {
            background: var(--card-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(37, 99, 235, 0.1);
            position: relative;
            overflow: hidden;
        }
        .brand-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(37, 99, 235, 0.12); border: 1px solid rgba(37, 99, 235, 0.3);
            color: #60a5fa; padding: 6px 16px; border-radius: 20px;
            font-size: 11px; font-weight: 800; letter-spacing: 0.8px;
            margin-bottom: 20px;
        }
        .input-group { margin-bottom: 18px; position: relative; }
        .input-label {
            font-size: 11px; font-weight: 800; color: var(--text-muted);
            letter-spacing: 0.6px; margin-bottom: 8px; display: block;
            text-transform: uppercase;
        }
        .input-wrapper {
            position: relative;
            display: flex; align-items: center;
        }
        .input-icon {
            position: absolute; left: 16px;
            color: var(--text-muted); width: 18px; height: 18px;
            pointer-events: none;
        }
        .input-field {
            width: 100%; padding: 14px 16px 14px 44px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 16px; color: #fff;
            font-size: 14px; outline: none; transition: all 0.25s ease;
        }
        .input-field:focus { 
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }
        .btn-action {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; border-radius: 16px;
            font-size: 14px; font-weight: 800; cursor: pointer;
            margin-top: 12px; transition: all 0.2s ease;
            box-shadow: 0 8px 20px var(--primary-glow);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-action:hover { transform: translateY(-1px); box-shadow: 0 12px 24px var(--primary-glow); }
        .btn-action:active { transform: translateY(1px); }
        .btn-action:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        /* Modern Fintech Skeleton Pulse Loader (Bila neno 'Inapakia') */
        #skeletonPulse {
            padding: 30px 0; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .glowing-orb {
            width: 56px; height: 56px; border-radius: 50%;
            background: radial-gradient(circle, #3b82f6 0%, rgba(37,99,235,0.1) 70%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
            animation: pulseGlow 1.5s infinite ease-in-out;
            margin-bottom: 16px;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(0.95); opacity: 0.6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 30px rgba(59, 130, 246, 0.8); }
        }

        .btn-spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(15, 23, 42, 0.95); color: #fff; padding: 14px 28px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15); font-size: 13px; font-weight: 700;
            z-index: 3000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="toast">✅ Taarifa</div>

    <div class="portal-card">
        <div style="text-align: center;">
            <div class="brand-badge">● MCHEZO WETU FINTECH ADMIN</div>
            <h2 id="portalHeading" style="font-size: 22px; font-weight: 900; margin: 0 0 6px 0; color: #fff;"></h2>
            <p id="portalSubheading" style="font-size: 12px; color: var(--text-muted); margin: 0 0 24px 0;"></p>
        </div>

        <!-- FINTECH GLOWING ORB SKELETON (BILA MANENO YA KAWAIDA) -->
        <div id="skeletonPulse">
            <div class="glowing-orb">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
        </div>

        <!-- FORM 1: USAJILI WA ADMIN (MARA YA KWANZA PEKEE) -->
        <form id="signupForm" style="display: none;" onsubmit="handleAdminSignup(event)">
            <div class="input-group">
                <label class="input-label">Jina Kamili la Admin</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="text" id="regFullName" class="input-field" placeholder="Mfano: Msimamizi Mkuu" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Barua Pepe (Email ya Kuatumiwa OTP)</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <input type="email" id="regEmail" class="input-field" placeholder="admin@mchezowetu.com" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Namba ya Simu</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    <input type="tel" id="regPhone" class="input-field" placeholder="07XXXXXXXX">
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Nenosiri (Password)</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" id="regPassword" class="input-field" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" id="btnSignup" class="btn-action">
                <span>Jisajili & Tuma OTP kwa Email ➔</span>
            </button>
        </form>

        <!-- FORM 2: LOGIN YA ADMIN (INAPOKUWAPO SUPABASE) -->
        <form id="loginForm" style="display: none;" onsubmit="handleAdminLogin(event)">
            <div class="input-group">
                <label class="input-label">Email au Namba ya Simu</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <input type="text" id="loginIdentifier" class="input-field" placeholder="Ingiza Email au Simu" required>
                </div>
            </div>
            <div class="input-group">
                <label class="input-label">Nenosiri (Password)</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" id="loginPassword" class="input-field" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" id="btnLogin" class="btn-action">
                <span>Ingia & Tuma OTP kwa Email ➔</span>
            </button>
        </form>

        <!-- FORM 3: UTHIBITISHO WA EMAIL OTP -->
        <form id="otpForm" style="display: none;" onsubmit="handleVerifyOtp(event)">
            <div class="input-group" style="text-align: center;">
                <label class="input-label">Ingiza OTP Ya Tarakimu 6</label>
                <input type="number" id="otpInput" class="input-field" placeholder="123456" style="padding-left: 16px; text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: 900; background: rgba(16, 185, 129, 0.05); border-color: rgba(16, 185, 129, 0.3);" required>
            </div>
            <button type="submit" id="btnOtp" class="btn-action" style="background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px var(--accent-glow);">
                <span>Thibitisha & Ingia ➔</span>
            </button>
        </form>
    </div>

    <script>
        let currentEmail = '';
        let currentMode = '';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function setBtnLoading(btnId, isLoading, defaultText, loadingText) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = `<div class="btn-spinner"></div> <span>${loadingText}</span>`;
            } else {
                btn.disabled = false;
                btn.innerHTML = `<span>${defaultText}</span>`;
            }
        }

        async function checkAdminStatus() {
            try {
                const res = await fetch('/api/admin/check-exists');
                const data = await res.json();
                
                document.getElementById('skeletonPulse').style.display = 'none';

                if (data.exists) {
                    document.getElementById('portalHeading').innerText = 'Kuingia Msimamizi';
                    document.getElementById('portalSubheading').innerText = 'Ingiza taarifa za utawala kupokea OTP kwenye Email';
                    document.getElementById('loginForm').style.display = 'block';
                } else {
                    document.getElementById('portalHeading').innerText = 'Usajili wa Msimamizi Mkuu';
                    document.getElementById('portalSubheading').innerText = 'Tengeneza akaunti ya Admin ya mara ya kwanza';
                    document.getElementById('signupForm').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('skeletonPulse').style.display = 'none';
                showToast('⚠️ Imeshindikana kuangalia hali ya Admin.');
            }
        }

        async function handleAdminSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            setBtnLoading('btnSignup', true, '', 'Inasindika & Kutuma OTP...');

            try {
                const res = await fetch('/api/admin/register-send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phone, email, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    currentEmail = data.email;
                    currentMode = 'REGISTER';
                    document.getElementById('signupForm').style.display = 'none';
                    document.getElementById('otpForm').style.display = 'block';
                    document.getElementById('portalHeading').innerText = 'Thibitisha Email OTP';
                    document.getElementById('portalSubheading').innerText = 'OTP imetumwa kwenye barua pepe: ' + data.email;
                    showToast('📧 OTP imetumwa kwenye Email yako!');
                } else {
                    showToast('⚠️ ' + data.message);
                    setBtnLoading('btnSignup', false, 'Jisajili & Tuma OTP kwa Email ➔', '');
                }
            } catch (err) {
                showToast('⚠️ Imeshindikana kutuma OTP.');
                setBtnLoading('btnSignup', false, 'Jisajili & Tuma OTP kwa Email ➔', '');
            }
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            setBtnLoading('btnLogin', true, '', 'Inathibitisha...');

            try {
                const res = await fetch('/api/admin/login-send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (data.success) {
                    currentEmail = data.email;
                    currentMode = 'LOGIN';
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('otpForm').style.display = 'block';
                    document.getElementById('portalHeading').innerText = 'Thibitisha Email OTP';
                    document.getElementById('portalSubheading').innerText = 'OTP imetumwa kwenye barua pepe: ' + data.email;
                    showToast('📧 OTP imetumwa kwenye Email yako!');
                } else {
                    showToast('⚠️ ' + data.message);
                    setBtnLoading('btnLogin', false, 'Ingia & Tuma OTP kwa Email ➔', '');
                }
            } catch (err) {
                showToast('⚠️ Taarifa si sahihi.');
                setBtnLoading('btnLogin', false, 'Ingia & Tuma OTP kwa Email ➔', '');
            }
        }

        async function handleVerifyOtp(e) {
            e.preventDefault();
            const otp = document.getElementById('otpInput').value.trim();
            const endpoint = currentMode === 'REGISTER' ? '/api/admin/register-verify-otp' : '/api/admin/login-verify-otp';

            setBtnLoading('btnOtp', true, '', 'Inahakiki OTP...');

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('adminToken', 'MW-ADMIN-AUTHENTICATED');
                    showToast('✅ Imethibitishwa rasmi!');
                    setTimeout(() => { window.location.href = '/admin.html'; }, 1000);
                } else {
                    showToast('⚠️ ' + data.message);
                    setBtnLoading('btnOtp', false, 'Thibitisha & Ingia ➔', '');
                }
            } catch (err) {
                showToast('⚠️ Verification imefeli.');
                setBtnLoading('btnOtp', false, 'Thibitisha & Ingia ➔', '');
            }
        }

        checkAdminStatus();
    </script>
</body>
</html>
