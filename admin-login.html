<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Admin Portal Login</title>
    <style>
        :root {
            --bg-deep: #060913;
            --card-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: var(--card-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 32px 24px;
            width: 100%; max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: center;
            position: relative;
        }
        .shield-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin: 0 auto 16px auto;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
        }
        .input-group {
            margin-bottom: 16px; text-align: left;
        }
        .input-label {
            font-size: 11px; font-weight: 800; color: var(--text-muted);
            letter-spacing: 0.5px; margin-bottom: 6px; display: block;
        }
        .input-field {
            width: 100%; padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 14px; color: #fff;
            font-size: 14px; outline: none;
            transition: all 0.2s;
        }
        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .btn-login {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; border: none; border-radius: 14px;
            font-size: 14px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            transition: transform 0.2s;
            margin-top: 8px;
        }
        .btn-login:active { transform: scale(0.97); }
        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(30, 41, 59, 0.95); color: #fff; padding: 12px 24px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2); font-size: 13px; font-weight: 700;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 3000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; backdrop-filter: blur(10px);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="toast">✅ Taarifa</div>

    <div class="login-card">
        <div class="shield-icon">🛡️</div>
        <h2 style="font-size: 20px; font-weight: 900; margin: 0 0 4px 0; color: #fff;">JOPO LA UTAWALA</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 24px 0;">Ingiza taarifa za utawala mkuu kupata ufikiaji</p>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="input-group">
                <label class="input-label">ADMIN USERNAME AU SIMU</label>
                <input type="text" id="adminIdentifier" class="input-field" placeholder="Kutano: admin" required>
            </div>
            <div class="input-group">
                <label class="input-label">NENOSIRI (PASSWORD)</label>
                <input type="password" id="adminPassword" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Ingia Kwenye Admin Portal ➔</button>
        </form>
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('adminIdentifier').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('adminToken', 'MW-ADMIN-AUTHENTICATED');
                    showToast('✅ Umefanikiwa kuingia!');
                    setTimeout(() => {
                        window.location.href = '/admin.html';
                    }, 1000);
                } else {
                    showToast('⚠️ ' + data.message);
                }
            } catch (err) {
                showToast('⚠️ Imeshindikana kuunganisha na seva.');
            }
        }
    </script>
</body>
</html>
