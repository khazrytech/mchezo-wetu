<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Super Admin Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --card-glass: rgba(15, 23, 42, 0.92);
            --border-glass: rgba(168, 85, 247, 0.35);
            --primary-purple: #8b5cf6;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(139, 92, 246, 0.35) 0%, transparent 60%),
                radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.25) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        #toast-container {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; width: 90%; max-width: 360px; pointer-events: none;
        }

        .custom-toast {
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px); color: #fff; padding: 14px 18px; border-radius: 16px;
            font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8); margin-bottom: 10px;
            transform: translateY(-20px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: auto;
        }
        .custom-toast.show { transform: translateY(0); opacity: 1; }
        .custom-toast.error { border-left: 4px solid #ef4444; }
        .custom-toast.success { border-left: 4px solid #10b981; }

        .auth-wrapper { width: 100%; max-width: 400px; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .brand-header { text-align: center; margin-bottom: 24px; }
        .shield-ring {
            width: 86px; height: 86px; border-radius: 26px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.5); font-size: 38px;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .app-title { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .app-subtitle { font-size: 11px; font-weight: 800; color: #f472b6; text-transform: uppercase; letter-spacing: 2px; margin-top: 6px; }

        .auth-card {
            background: var(--card-glass); backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass); border-radius: 28px; padding: 28px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95);
        }

        .pro-header-badge {
            background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 16px; padding: 12px; text-align: center; margin-bottom: 22px;
            font-weight: 800; font-size: 13px; color: #c084fc; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .input-group { margin-bottom: 16px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; font-size: 16px; color: var(--text-sub); }

        .custom-input {
            width: 100%; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 15px 16px 15px 46px; border-radius: 16px; color: #fff; font-size: 14px; outline: none;
            transition: all 0.2s ease;
        }
        .custom-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }

        .btn-submit-glow {
            width: 100%; background: linear-gradient(135deg, #8b5cf6 0%, #db2777 100%);
            color: #fff; border: none; padding: 16px; border-radius: 18px; font-weight: 800; font-size: 15px;
            cursor: pointer; box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.6); display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 10px; transition: transform 0.2s;
        }
        .btn-submit-glow:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="auth-wrapper">
        <div class="brand-header">
            <div class="shield-ring">🛡️</div>
            <h1 class="app-title">Mchezo Wetu</h1>
            <div class="app-subtitle">SUPER ADMIN SECURE GATEWAY</div>
        </div>

        <div class="auth-card">
            <div class="pro-header-badge">
                <span>🔐</span> <span>Eneo Maalum la Utawala Mkuu</span>
            </div>

            <form id="adminLoginForm">
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="adminIdentifier" class="custom-input" placeholder="Admin Email au Jina" autocomplete="username" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="adminPassword" class="custom-input" placeholder="Nenosiri la Siri" autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit-glow">
                    <span>Fungua Admin Dashboard</span> <span>→</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('adminIdentifier').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (!identifier || !password) {
                showToast('Jaza taarifa zote za Admin.', 'error');
                return;
            }

            try {
                const res = await fetch('/api/auth/login-admin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    showToast(data.error || 'Ingia ya Admin imeshindikana.', 'error');
                } else {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'admin.html';
                }
            } catch(e) {
                showToast('Shida ya mtandao.', 'error');
            }
        });
    </script>
</body>
</html>
