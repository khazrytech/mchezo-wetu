<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #030712; --card: #111827; --border: #1f2937; --primary: #3b82f6; --success: #10b981; --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: #f9fafb; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .user-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 12px; border: none; cursor: pointer; }
        .btn-approve { background: var(--success); color: #fff; }
        .btn-ban { background: var(--danger); color: #fff; }
        .status-badge { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Control Panel - Mchezo Wetu</h1>
        <p style="color: #9ca3af; margin-bottom: 20px;">Simamia wanachama waliojisajili, idhinisha (Approve) au piga marufuku (Ban).</p>
        <div id="usersList">Inapakia wanachama...</div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                const container = document.getElementById('usersList');
                container.innerHTML = '';

                users.forEach(u => {
                    const div = document.createElement('div');
                    div.className = 'user-card';
                    div.innerHTML = `
                        <div>
                            <strong>${u.full_name || 'Bila Jina'}</strong><br>
                            <small style="color:#9ca3af;">${u.email}</small><br>
                            Status: <span style="color:${u.is_approved ? 'var(--success)' : 'orange'}">${u.is_approved ? 'Approved' : 'Pending Approval'}</span> | 
                            Banned: <span style="color:${u.is_banned ? 'var(--danger)' : 'var(--success)'}">${u.is_banned ? 'YES' : 'NO'}</span>
                        </div>
                        <div>
                            ${!u.is_approved ? `<button class="btn btn-approve" onclick="actionUser('${u.id}', 'approve')">Approve ✓</button>` : ''}
                            ${!u.is_banned ? `<button class="btn btn-ban" onclick="actionUser('${u.id}', 'ban')">Ban ✕</button>` : `<button class="btn btn-approve" onclick="actionUser('${u.id}', 'unban')">Unban</button>`}
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function actionUser(userId, action) {
            const res = await fetch('/api/admin/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, action })
            });
            const data = await res.json();
            if (data.success) {
                loadUsers();
            } else {
                alert('Imeshindikana: ' + data.error);
            }
        }

        loadUsers();
    </script>
</body>
</html>
