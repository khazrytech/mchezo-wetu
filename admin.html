<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --surface-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 90%, rgba(16, 185, 129, 0.1) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
        }

        .admin-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-glass);
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 16px 12px;
            text-align: center;
        }

        .stat-val { font-size: 20px; font-weight: 800; margin-top: 4px; }
        .stat-lbl { font-size: 10px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-card {
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .user-info h4 {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 4px;
        }

        .user-info p {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-approved { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-banned { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-act {
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-act:active { transform: scale(0.95); }

        .btn-approve { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-ban { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-unban { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <div class="brand-subtitle">Mchezo Wetu Hub</div>
                <div class="brand-title">Admin Dashboard</div>
            </div>
            <a href="dashboard.html" class="back-btn">← Portal</a>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-lbl">Wanachama</div>
                <div class="stat-val" id="cntTotal">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">Pending</div>
                <div class="stat-val" style="color: var(--warning);" id="cntPending">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">Banned</div>
                <div class="stat-val" style="color: var(--danger);" id="cntBanned">0</div>
            </div>
        </div>

        <div class="section-title">
            <span>Usimamizi wa Wanachama</span>
            <span style="font-size: 12px; color: var(--text-sub); font-weight: 600;" onclick="fetchUsersList()" style="cursor:pointer;">🔄 Onesha upya</span>
        </div>

        <div id="usersContainer">
            <div style="text-align: center; padding: 30px; color: var(--text-sub);">Inapakia orodha ya wanachama...</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchUsersList();
        });

        async function fetchUsersList() {
            const container = document.getElementById('usersContainer');
            try {
                const res = await fetch('/api/admin/users');
                if (!res.ok) throw new Error("Shida ya mtandao");
                const users = await res.json();
                
                if (!users || users.length === 0) {
                    container.innerHTML = `
                        <div class="user-card" style="justify-content: center; text-align: center;">
                            <p style="color: var(--text-sub);">Hakuna mwanachama aliyesajiliwa bado.</p>
                        </div>
                    `;
                    return;
                }

                let pending = 0, banned = 0;
                container.innerHTML = '';

                users.forEach(u => {
                    if (!u.is_approved) pending++;
                    if (u.is_banned) banned++;

                    const card = document.createElement('div');
                    card.className = 'user-card';
                    card.innerHTML = `
                        <div class="user-info">
                            <h4>${u.full_name || 'Mwanachama'}</h4>
                            <p>${u.email} • ${u.phone || 'Hakuna Simu'}</p>
                            <div>
                                <span class="badge ${u.is_banned ? 'badge-banned' : (u.is_approved ? 'badge-approved' : 'badge-pending')}">
                                    ${u.is_banned ? 'Banned ✕' : (u.is_approved ? 'Approved ✓' : 'Pending Approval')}
                                </span>
                            </div>
                        </div>
                        <div class="action-btns">
                            ${!u.is_approved && !u.is_banned ? `<button class="btn-act btn-approve" onclick="handleAction('${u.id}', 'approve')">Approve ✓</button>` : ''}
                            ${!u.is_banned ? `<button class="btn-act btn-ban" onclick="handleAction('${u.id}', 'ban')">Ban ✕</button>` : `<button class="btn-act btn-unban" onclick="handleAction('${u.id}', 'unban')">Unban</button>`}
                        </div>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('cntTotal').innerText = users.length;
                document.getElementById('cntPending').innerText = pending;
                document.getElementById('cntBanned').innerText = banned;

            } catch (e) {
                container.innerHTML = `
                    <div class="user-card" style="flex-direction: column; text-align: center; gap: 10px;">
                        <p style="color: var(--danger);">Imeshindikana kupakia data kutoka Supabase.</p>
                        <button class="btn-act btn-approve" onclick="fetchUsersList()">Subiri kidogo kisha Bonyeza Hapa</button>
                    </div>
                `;
            }
        }

        async function handleAction(userId, action) {
            try {
                const res = await fetch('/api/admin/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, action })
                });
                const data = await res.json();
                if (data.success) {
                    fetchUsersList();
                } else {
                    alert('Imeshindikana: ' + (data.error || 'Jaribu tena.'));
                }
            } catch (e) {
                alert('Tafadhali hakikisha muunganisho wa mtandao upo sawa.');
            }
        }
    </script>
</body>
</html>
