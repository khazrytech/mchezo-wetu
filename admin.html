<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Jopo la Utawala (Admin Panel)</title>
    <style>
        :root {
            --bg-deep: #030712;
            --card-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary: #3b82f6;
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% -20%, #1e3a8a 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header h1 {
            font-size: 24px;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 24px 0 12px 0;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .user-card {
            background: var(--card-glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .user-card:hover {
            transform: translateY(-3px);
        }

        .user-info {
            font-size: 13px;
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .user-info strong {
            color: var(--text-muted);
            display: inline-block;
            width: 80px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-approve {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .btn-approve:hover {
            background: rgba(16, 185, 129, 0.3);
        }

        .btn-reject {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-reject:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .badge-approved {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            background: var(--card-glass);
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Jopo la Utawala</h1>
            <p>Simamia Maombi na Wanachama wa Mchezo Wetu</p>
        </div>

        <!-- MAOMBI YANAYOSUBIRI (PENDING REQUESTS) -->
        <div class="section-title">⏳ Maombi Mapya Yanayosubiri Idhini (<span id="pendingCount">0</span>)</div>
        <div id="pendingList" class="card-grid">
            <div class="empty-state">Inapakia maombi...</div>
        </div>

        <!-- WANACHAMA WALIOTHIBITISHWA (APPROVED MEMBERS) -->
        <div class="section-title" style="margin-top: 36px;">✅ Wanachama Waliothibitishwa (<span id="approvedCount">0</span>)</div>
        <div id="approvedList" class="card-grid">
            <div class="empty-state">Hakuna wanachama waliothibitishwa bado.</div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();

                const pendingContainer = document.getElementById('pendingList');
                const approvedContainer = document.getElementById('approvedList');

                const pendingUsers = users.filter(u => u.status === 'pending');
                const approvedUsers = users.filter(u => u.status === 'approved');

                document.getElementById('pendingCount').innerText = pendingUsers.length;
                document.getElementById('approvedCount').innerText = approvedUsers.length;

                // Render Pending Requests
                if (pendingUsers.length === 0) {
                    pendingContainer.innerHTML = `<div class="empty-state">Hakuna maombi mapya yanayosubiri kwa sasa.</div>`;
                } else {
                    pendingContainer.innerHTML = '';
                    pendingUsers.forEach(u => {
                        const card = document.createElement('div');
                        card.className = 'user-card';
                        card.innerHTML = `
                            <div class="user-info">
                                <strong>Jina:</strong> ${u.fullName}<br>
                                <strong>Simu:</strong> ${u.phone}<br>
                                <strong>Barua Pepe:</strong> ${u.email}<br>
                                <strong>Tarehe:</strong> ${u.createdAt}
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-approve" onclick="approveUser('${u.id}')">Kubali (Approve)</button>
                                <button class="btn btn-reject" onclick="rejectUser('${u.id}')">Kataa</button>
                            </div>
                        `;
                        pendingContainer.appendChild(card);
                    });
                }

                // Render Approved Members
                if (approvedUsers.length === 0) {
                    approvedContainer.innerHTML = `<div class="empty-state">Hakuna wanachama waliothibitishwa bado.</div>`;
                } else {
                    approvedContainer.innerHTML = '';
                    approvedUsers.forEach(u => {
                        const card = document.createElement('div');
                        card.className = 'user-card';
                        card.innerHTML = `
                            <div class="user-info">
                                <strong>Jina:</strong> ${u.fullName}<br>
                                <strong>Simu:</strong> ${u.phone}<br>
                                <strong>Namba:</strong> <span style="color: #60a5fa; font-weight: bold;">${u.memberNumber}</span><br>
                                <div style="margin-top: 8px;"><span class="badge-approved">Verified Member</span></div>
                            </div>
                        `;
                        approvedContainer.appendChild(card);
                    });
                }
            } catch (err) {
                console.error("Hitilafu ya kupakia taarifa za admin:", err);
            }
        }

        async function approveUser(id) {
            const res = await fetch(`/api/admin/approve/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                alert(data.message);
                loadAdminData();
            } else {
                alert(data.message);
            }
        }

        async function rejectUser(id) {
            if (confirm("Una hakika unataka kukataa na kufuta ombi hili?")) {
                const res = await fetch(`/api/admin/reject/${id}`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    loadAdminData();
                } else {
                    alert(data.message);
                }
            }
        }

        loadAdminData();
        // Refresh kila baada ya sekunde 5 ili uweze kuona maombi mapya moja kwa moja
        setInterval(loadAdminData, 5000);
    </script>
</body>
</html>
