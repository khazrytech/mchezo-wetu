<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Super Admin Control Center (Enterprise Mega Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #030712;
            --surface-admin: rgba(24, 18, 48, 0.95);
            --border-purple: rgba(168, 85, 247, 0.5);
            --primary-purple: #9333ea;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #c084fc;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-obsidian);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(147, 51, 234, 0.32) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(236, 72, 153, 0.22) 0%, transparent 40%),
                radial-gradient(circle at 90% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 16px 120px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Admin Enterprise Header */
        .admin-enterprise-header {
            background: var(--surface-admin); border: 1px solid var(--border-purple);
            backdrop-filter: blur(30px); border-radius: 26px; padding: 22px 26px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.85);
        }
        .admin-title-group h1 { font-size: 19px; font-weight: 800; color: #fff; }
        .admin-title-group p { font-size: 10px; color: var(--text-sub); font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; margin-top: 5px; }

        .member-portal-link {
            background: rgba(59, 130, 246, 0.22); border: 1px solid rgba(59, 130, 246, 0.6);
            color: #60a5fa; padding: 9px 16px; border-radius: 16px; font-size: 11px; font-weight: 800; text-decoration: none;
            display: flex; align-items: center; gap: 6px;
        }

        /* Admin Stats Matrix */
        .admin-stats-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
        .admin-stat-card-box {
            background: var(--surface-admin); border: 1px solid var(--border-purple);
            border-radius: 24px; padding: 22px; backdrop-filter: blur(25px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.65);
        }
        .stat-card-label { font-size: 11px; color: var(--text-sub); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; }
        .stat-card-num { font-size: 28px; font-weight: 800; color: #fff; }

        /* Admin Content Matrix */
        .admin-content-matrix {
            background: var(--surface-admin); border: 1px solid var(--border-purple);
            border-radius: 30px; padding: 24px; backdrop-filter: blur(30px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.75); margin-bottom: 22px;
        }
        .matrix-section-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        .member-record-card {
            background: rgba(3, 7, 18, 0.8); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s;
        }
        .record-name-lbl { font-size: 14px; font-weight: 700; color: #fff; }
        .record-phone-lbl { font-size: 11px; color: var(--text-sub); margin-top: 4px; }

        .btn-matrix-action {
            background: linear-gradient(135deg, #9333ea, #db2777); color: #fff; border: none;
            padding: 10px 18px; border-radius: 14px; font-size: 11px; font-weight: 800; cursor: pointer;
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.45); transition: transform 0.2s;
        }
        .btn-matrix-action:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="admin-enterprise-header">
        <div class="admin-title-group">
            <h1>🛡️ Super Admin Control Center</h1>
            <p>Direct Access - Utawala Mkuu</p>
        </div>
        <a href="/dashboard" class="member-portal-link">Member View 👤</a>
    </div>

    <!-- Stats Matrix -->
    <div class="admin-stats-matrix">
        <div class="admin-stat-card-box">
            <div class="stat-card-label">Jumla ya Wanachama</div>
            <div class="stat-card-num" id="totalUsersCount">0</div>
        </div>
        <div class="admin-stat-card-box">
            <div class="stat-card-label">Hali ya Mfumo</div>
            <div class="stat-card-num" style="font-size: 17px; color: var(--success); margin-top: 6px;">🟢 Wazi Direct</div>
        </div>
    </div>

    <!-- Users Management Matrix -->
    <div class="admin-content-matrix">
        <div class="matrix-section-title">
            <span>Usimamizi wa Wanachama Wote</span>
            <span style="font-size: 11px; color: var(--accent-pink);">Supabase Live Sync</span>
        </div>
        <div id="adminUsersListContainer">
            <div class="member-record-card">
                <div>
                    <div class="record-name-lbl">Inapakia taarifa kutoka Database...</div>
                    <div class="record-phone-lbl">Tafadhali subiri kidogo</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Enterprise Admin Core JavaScript Controller & Supabase API Handlers
        async function fetchAdminData() {
            try {
                console.log("Fetching admin users data from server API...");
                const response = await fetch('/api/admin/users');
                const list = await response.json();
                document.getElementById('totalUsersCount').innerText = list.length;
                
                const container = document.getElementById('adminUsersListContainer');
                if (list && list.length > 0) {
                    container.innerHTML = list.map(member => `
                        <div class="member-record-card">
                            <div>
                                <div class="record-name-lbl">${member.full_name || member.email || 'Mwanachama'}</div>
                                <div class="record-phone-lbl">${member.phone || 'Namba haijawekwa'}</div>
                            </div>
                            <button class="btn-matrix-action" onclick="executeAdminAction('${member.id}', '${member.is_approved ? 'ban' : 'approve'}')">
                                ${member.is_approved ? 'Zuia (Ban)' : 'Idhinisha'}
                            </button>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div style="text-align:center; color:#c084fc; font-size:12px; padding:25px;">Hakuna wanachama waliopatikana kwenye hifadhidata kwa sasa.</div>';
                }
            } catch(err) {
                console.error("Hitilafu kwenye kupata data ya admin:", err);
            }
        }

        async function executeAdminAction(userId, actionType) {
            try {
                console.log("Executing admin action:", actionType, "for user:", userId);
                const req = await fetch('/api/admin/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, action: actionType })
                });
                const resData = await req.json();
                if (resData.success) {
                    fetchAdminData();
                } else {
                    alert('Kimeshindikana kutekeleza amri.');
                }
            } catch(error) {
                alert('Hitilafu ya mtandao imetokea.');
            }
        }

        // Initialize Admin Dashboard on load
        window.addEventListener('DOMContentLoaded', () => {
            fetchAdminData();
        });
    </script>

</body>
</html>
