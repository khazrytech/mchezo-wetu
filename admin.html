<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Jopo la Utawala Pro</title>
    <style>
        :root {
            --bg-deep: #060913;
            --card-glass: rgba(15, 23, 42, 0.78);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.3);
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0; padding: 16px 16px 100px 16px;
            min-height: 100vh;
        }

        .top-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .admin-profile {
            background: var(--card-glass); backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); padding: 8px 14px;
            border-radius: 20px; display: flex; align-items: center; gap: 10px;
        }
        .admin-avatar {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }
        .btn-logout {
            background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--danger); padding: 10px; border-radius: 14px; cursor: pointer; font-size: 16px;
        }

        .card-glass {
            background: var(--card-glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass); border-radius: 24px;
            padding: 20px; margin-bottom: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* WATU SECTION STYLES */
        .user-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s;
        }
        .user-avatar {
            width: 44px; height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 900; color: #fff;
            flex-shrink: 0;
        }
        .user-details { flex-grow: 1; }
        .user-name { font-size: 14px; font-weight: 800; color: #fff; }
        .user-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .user-actions { display: flex; gap: 6px; align-items: center; }

        .btn-call {
            background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent); width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px;
        }
        .btn-approve {
            background: linear-gradient(135deg, #059669, #10b981); color: #fff;
            border: none; padding: 8px 14px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .filter-tabs {
            display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px;
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-glass);
            color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: 700;
            cursor: pointer; whitespace: nowrap;
        }
        .filter-btn.active {
            background: var(--primary); color: #fff; border-color: var(--primary);
        }

        .search-box {
            width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass); border-radius: 16px; color: #fff;
            font-size: 13px; margin-bottom: 16px; outline: none; box-sizing: border-box;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-glass); display: flex; justify-content: space-around;
            padding: 12px 0 16px 0; z-index: 100;
        }
        .nav-item {
            background: none; border: none; color: var(--text-muted);
            font-size: 11px; font-weight: 700; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .nav-item.active { color: var(--primary); }

        #toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(30, 41, 59, 0.95); color: #fff; padding: 12px 24px; border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2); font-size: 13px; font-weight: 700;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 3000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; backdrop-filter: blur(10px);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 19, 0.85); backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
            padding: 20px; box-sizing: border-box;
        }
        .modal-card {
            background: #0f172a; border: 1px solid var(--border-glass);
            width: 100%; max-width: 400px; border-radius: 24px; padding: 24px;
        }
        .input-field {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glass); border-radius: 12px;
            color: #fff; font-size: 13px; margin-bottom: 12px; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="toast">✅ Taarifa</div>

    <!-- HEADER -->
    <div class="top-header">
        <div class="admin-profile">
            <div class="admin-avatar">🛡️</div>
            <div>
                <div style="font-size: 13px; font-weight: 800; color: #fff;">JOPO LA UTAWALA PRO</div>
                <div style="font-size: 10px; color: #ec4899; font-weight: 700;">Super Admin</div>
            </div>
        </div>
        <button class="btn-logout" onclick="handleLogout()" title="Ondoka">🚪</button>
    </div>

    <!-- DASHBOARD TAB -->
    <div id="dashibodiView" class="tab-view">
        <div class="card-glass" style="background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));">
            <div style="font-size: 10px; font-weight: 800; color: var(--text-muted);">SALIO KUU LA KIKUNDI</div>
            <div style="font-size: 32px; font-weight: 900; color: #fff; margin: 8px 0 16px 0;">TSh 245,000</div>
            
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
                <button onclick="switchTab('watu')" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); color: #fff; padding: 10px; border-radius: 14px; font-size: 10px; font-weight: 800; cursor: pointer;">👤 SAJILI</button>
                <button onclick="showToast('Sehemu ya Rekodi za kifedha ipo tayari')" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); color: #fff; padding: 10px; border-radius: 14px; font-size: 10px; font-weight: 800; cursor: pointer;">💰 REKODI</button>
                <button onclick="openTangazoModal()" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); color: #fff; padding: 10px; border-radius: 14px; font-size: 10px; font-weight: 800; cursor: pointer;">📢 TANGAZO</button>
                <button onclick="showToast('Inatengeneza ripoti...')" style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); color: #fff; padding: 10px; border-radius: 14px; font-size: 10px; font-weight: 800; cursor: pointer;">📊 RIPOTI</button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="card-glass" style="padding: 16px;">
                <div style="font-size: 10px; color: var(--text-muted); font-weight: 700;">JUMLA ZOTE</div>
                <div style="font-size: 16px; font-weight: 800; color: #fff; margin-top: 4px;">TSh 1,250,000</div>
            </div>
            <div class="card-glass" style="padding: 16px;" onclick="switchTab('watu')">
                <div style="font-size: 10px; color: var(--warning); font-weight: 800;">YANAYOSUBIRI</div>
                <div id="pendingCount" style="font-size: 22px; font-weight: 900; color: var(--warning); margin-top: 2px;">0</div>
            </div>
        </div>
    </div>

    <!-- WATU TAB (KUSAFISHWA NA KUWA KISASA KABISA) -->
    <div id="watuView" class="tab-view" style="display: none;">
        <input type="text" id="userSearch" class="search-box" placeholder="🔍 Tafuta mwanachama kwa jina au namba ya simu..." oninput="filterUsersList()">

        <div class="filter-tabs">
            <button class="filter-btn active" id="btnFilterAll" onclick="setFilter('all')">Wote (<span id="cntAll">0</span>)</button>
            <button class="filter-btn" id="btnFilterPending" onclick="setFilter('pending')">⏳ Yanayosubiri (<span id="cntPending">0</span>)</button>
            <button class="filter-btn" id="btnFilterApproved" onclick="setFilter('approved')">✓ Active (<span id="cntApproved">0</span>)</button>
        </div>

        <div id="usersListContainer">
            <p style="font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 20px;">Inapakia wanachama...</p>
        </div>
    </div>

    <!-- SETINGI TAB -->
    <div id="setingiView" class="tab-view" style="display: none;">
        <div class="card-glass">
            <h3 style="font-size: 15px; margin: 0 0 10px 0;">Mipangilio ya Mfumo</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Super Admin Portal. Mfumo umeunganishwa na Supabase Database ya Kudumu.</p>
            <button onclick="handleLogout()" style="width: 100%; padding: 12px; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: var(--danger); border-radius: 12px; font-weight: 800; cursor: pointer;">
                🚪 Toka Kwenye Admin Portal
            </button>
        </div>
    </div>

    <!-- TANGAZO MODAL -->
    <div id="tangazoModal" class="modal-overlay">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 16px; margin: 0; color: #fff;">Tuma Tangazo kwa Wanachama</h3>
                <button onclick="closeTangazoModal()" style="background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer;">✕</button>
            </div>
            <input type="text" id="annTitle" placeholder="Kichwa cha Habari" class="input-field">
            <textarea id="annMessage" placeholder="Ujumbe utakaoonekana kwenye kengele ya arifa 🔔..." class="input-field" style="height: 100px; resize: none;"></textarea>
            <button onclick="submitTangazo()" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer;">Tuma Tangazo Sasa</button>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <button onclick="switchTab('dashibodi')" id="navDashibodi" class="nav-item active">
            <span style="font-size: 18px;">📊</span> Dashibodi
        </button>
        <button onclick="switchTab('watu')" id="navWatu" class="nav-item">
            <span style="font-size: 18px;">👥</span> Watu
        </button>
        <button onclick="switchTab('setingi')" id="navSetingi" class="nav-item">
            <span style="font-size: 18px;">⚙️</span> Setingi
        </button>
    </div>

    <script>
        // Check Admin Auth Session
        if (!localStorage.getItem('adminToken')) {
            window.location.href = '/admin-login.html';
        }

        let rawUsers = [];
        let currentFilter = 'all';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-view').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tabName === 'dashibodi') {
                document.getElementById('dashibodiView').style.display = 'block';
                document.getElementById('navDashibodi').classList.add('active');
            } else if (tabName === 'watu') {
                document.getElementById('watuView').style.display = 'block';
                document.getElementById('navWatu').classList.add('active');
            } else if (tabName === 'setingi') {
                document.getElementById('setingiView').style.display = 'block';
                document.getElementById('navSetingi').classList.add('active');
            }
        }

        async function fetchAdminUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();
                if (data.success) {
                    rawUsers = data.users || [];
                    
                    const pendingUsers = rawUsers.filter(u => u.status === 'pending');
                    const approvedUsers = rawUsers.filter(u => u.status === 'approved');

                    document.getElementById('pendingCount').innerText = pendingUsers.length;
                    document.getElementById('cntAll').innerText = rawUsers.length;
                    document.getElementById('cntPending').innerText = pendingUsers.length;
                    document.getElementById('cntApproved').innerText = approvedUsers.length;

                    renderUsersList();
                }
            } catch (err) {
                console.error('Error fetching users:', err);
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (filter === 'all') document.getElementById('btnFilterAll').classList.add('active');
            if (filter === 'pending') document.getElementById('btnFilterPending').classList.add('active');
            if (filter === 'approved') document.getElementById('btnFilterApproved').classList.add('active');
            renderUsersList();
        }

        function filterUsersList() {
            renderUsersList();
        }

        function renderUsersList() {
            const container = document.getElementById('usersListContainer');
            const search = document.getElementById('userSearch').value.toLowerCase().trim();

            let filtered = rawUsers.filter(u => {
                const matchSearch = u.fullName.toLowerCase().includes(search) || u.phone.includes(search);
                if (currentFilter === 'pending') return matchSearch && u.status === 'pending';
                if (currentFilter === 'approved') return matchSearch && u.status === 'approved';
                return matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 0;">Hakuna mwanachama aliyepatikana.</div>';
                return;
            }

            container.innerHTML = filtered.map(u => {
                const initial = u.fullName ? u.fullName.charAt(0).toUpperCase() : 'M';
                const isPending = u.status === 'pending';
                return `
                    <div class="user-card">
                        <div class="user-avatar">${initial}</div>
                        <div class="user-details">
                            <div class="user-name">${u.fullName}</div>
                            <div class="user-meta">${u.phone} • ${u.memberNumber || 'MW-2026'}</div>
                            <div style="font-size: 10px; color: ${isPending ? 'var(--warning)' : 'var(--accent)'}; margin-top: 2px; font-weight: 800;">
                                ${isPending ? '⏳ Inasubiri Ithibati' : '✓ Active Member'}
                            </div>
                        </div>
                        <div class="user-actions">
                            <a href="tel:${u.phone}" class="btn-call" title="Piga Simu">📞</a>
                            ${isPending ? `<button onclick="approveUser('${u.phone}')" class="btn-approve">✓ Idhinisha</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function approveUser(phone) {
            try {
                const res = await fetch('/api/admin/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ Mwanachama amethibitishwa rasmi!');
                    fetchAdminUsers();
                } else {
                    showToast('⚠️ ' + data.message);
                }
            } catch (err) {
                showToast('⚠️ Imeshindikana kuidhinisha.');
            }
        }

        function openTangazoModal() {
            document.getElementById('tangazoModal').style.display = 'flex';
        }
        function closeTangazoModal() {
            document.getElementById('tangazoModal').style.display = 'none';
        }

        async function submitTangazo() {
            const title = document.getElementById('annTitle').value.trim();
            const message = document.getElementById('annMessage').value.trim();
            if (!title || !message) {
                showToast('⚠️ Tafadhali jaza kichwa na ujumbe!');
                return;
            }
            try {
                const res = await fetch('/api/announcements', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, message })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('📢 Tangazo limetumwa na kuhifadhiwa!');
                    closeTangazoModal();
                    document.getElementById('annTitle').value = '';
                    document.getElementById('annMessage').value = '';
                }
            } catch (err) {
                showToast('⚠️ Imeshindikana kutuma tangazo.');
            }
        }

        function handleLogout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin-login.html';
        }

        fetchAdminUsers();
        setInterval(fetchAdminUsers, 10000);
    </script>
</body>
</html>
