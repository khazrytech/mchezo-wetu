<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Ingia / Jisajili</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: rgba(23, 32, 51, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15), transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .brand-logo { text-align: center; margin-bottom: 24px; }
        .brand-logo h1 { font-size: 26px; font-weight: 800; color: #fff; }
        .brand-logo p { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-sub); margin-bottom: 6px; }
        .form-control {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            margin-top: 10px;
        }
        .toggle-text { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-sub); }
        .toggle-text a { color: var(--primary); font-weight: 700; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand-logo">
            <h1>Mchezo Wetu</h1>
            <p id="subTitle">Ingia kwenye mfumo wa mchezo wa kikundi</p>
        </div>

        <form id="authForm">
            <div class="form-group" id="fullNameGroup" style="display: none;">
                <label>Majina Kamili</label>
                <input type="text" id="fullNameInput" class="form-control" placeholder="Mfano: Makoitz Mako">
            </div>
            <div class="form-group">
                <label>Barua Pepe (Email)</label>
                <input type="email" id="emailInput" class="form-control" placeholder="jina@email.com" required>
            </div>
            <div class="form-group">
                <label>Nenosiri (Password)</label>
                <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Ingia Kwenye Akaunti →</button>
        </form>

        <div class="toggle-text">
            <span id="toggleQuestion">Huna akaunti?</span>
            <a id="toggleBtn" onclick="toggleAuthMode()">Jisajili Hapa</a>
        </div>
    </div>

    <script>
        let isSignUp = false;
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById("fullNameGroup").style.display = isSignUp ? "block" : "none";
            document.getElementById("subTitle").innerText = isSignUp ? "Tengeneza akaunti mpya ya mchezo" : "Ingia kwenye mfumo wa mchezo wa kikundi";
            document.getElementById("submitBtn").innerText = isSignUp ? "Jisajili Sasa →" : "Ingia Kwenye Akaunti →";
            document.getElementById("toggleQuestion").innerText = isSignUp ? "Unayo akaunti tayari?" : "Huna akaunti?";
            document.getElementById("toggleBtn").innerText = isSignUp ? "Ingia Hapa" : "Jisajili Hapa";
        }

        document.getElementById("authForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value;
            const fullName = document.getElementById("fullNameInput").value.trim();

            if (isSignUp) {
                if (!fullName) { alert("Tafadhali ingiza Majina Yako Kamili."); return; }
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName
                        }
                    }
                });
                if (error) {
                    alert("Makosa ya Usajili: " + error.message);
                } else {
                    alert("Usajili umefanikiwa! Unaweza kuingia sasa.");
                    toggleAuthMode();
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                if (error) {
                    alert("Ingio Limeshindikana: " + error.message);
                } else {
                    localStorage.setItem("token", data.session.access_token);
                    window.location.href = "dashboard.html";
                }
            }
        });
    </script>
</body>
</html>
