<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Mfumo wa Kikundi</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #10b981;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            margin: 16px;
            box-sizing: border-box;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo-area h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
        }
        .logo-area p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            background: #f8fafc;
            transition: all 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .btn-main {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 6px;
        }
        .btn-main:hover {
            background-color: var(--primary-dark);
        }
        .switch-link {
            text-align: center;
            margin-top: 18px;
        }
        .switch-link button {
            background: none;
            color: var(--primary);
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .switch-link button:hover {
            text-decoration: underline;
        }
        .alert-box {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            text-align: center;
            font-weight: 500;
        }
        .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fee2e2; }
        .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }
        
        /* Profile Design */
        .profile-view {
            text-align: center;
        }
        .user-avatar {
            width: 64px;
            height: 64px;
            background: #e0f2fe;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            margin: 0 auto 12px auto;
        }
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f0fdf4;
            color: #16a34a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid #bbf7d0;
            margin-top: 6px;
        }
        .member-number-card {
            background: #f8fafc;
            border: 1px dashed var(--border);
            padding: 12px;
            border-radius: 10px;
            margin: 16px 0;
        }
        .btn-logout {
            background-color: #fee2e2;
            color: #dc2626;
            margin-top: 12px;
        }
        .btn-logout:hover {
            background-color: #fecaca;
        }
    </style>
</head>
<body>
    <div class="app-card">
        
        <!-- SIGNUP SECTION -->
        <div id="signupSection">
            <div class="logo-area">
                <h1>Mchezo Wetu</h1>
                <p>Unda akaunti yako ya mfumo</p>
            </div>
            <div id="signupMsg"></div>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Jina Kamili</label>
                    <input type="text" id="regName" required placeholder="Mf. Juma Ally">
                </div>
                <div class="form-group">
                    <label>Namba ya Simu</label>
                    <input type="tel" id="regPhone" required placeholder="07xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>Barua Pepe (Hiari)</label>
                    <input type="email" id="regEmail" placeholder="juma@example.com">
                </div>
                <div class="form-group">
                    <label>Neno la Siri (Password)</label>
                    <input type="password" id="regPassword" required placeholder="Weka password imara">
                </div>
                <button type="submit" class="btn-main">Jisajili Sasa</button>
            </form>
            <div class="switch-link">
                <button onclick="showLogin()">Una akaunti tayari? Ingia (Sign In)</button>
            </div>
        </div>

        <!-- LOGIN SECTION (Clean & Minimalist) -->
        <div id="loginSection" style="display: none;">
            <div class="logo-area">
                <h1>Karibu Tena</h1>
                <p>Ingia kwenye mfumo wako</p>
            </div>
            <div id="loginMsg"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Simu, Jina, au Namba ya Mwanachama</label>
                    <input type="text" id="loginIdentifier" required placeholder="Ingiza simu, jina au MW-xxxx">
                </div>
                <div class="form-group">
                    <label>Neno la Siri (Password)</label>
                    <input type="password" id="loginPassword" required placeholder="Weka password yako">
                </div>
                <button type="submit" class="btn-main">Ingia (Sign In)</button>
            </form>
            <div class="switch-link" id="switchSignupContainer">
                <button onclick="showSignup()" id="toSignupBtn">Haujasajiliwa? Jisajili</button>
            </div>
        </div>

        <!-- PROFILE SECTION (Verified Member) -->
        <div id="profileSection" style="display: none;" class="profile-view">
            <div class="user-avatar" id="userAvatar">MW</div>
            <h2 id="profName" style="margin: 0 0 2px 0; font-size: 18px;">Jina</h2>
            <div>
                <span class="verified-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="#16a34a"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    Verified Member
                </span>
            </div>

            <div class="member-number-card">
                <span style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Namba ya Uanachama</span><br>
                <span id="profMemberNumber" style="font-size: 18px; color: var(--primary); font-weight: 800;"></span>
            </div>

            <div style="text-align: left; font-size: 13px; background: #f8fafc; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;">
                <p style="margin: 4px 0; color: var(--text-muted);">Simu: <strong id="profPhone" style="color: var(--text-main);"></strong></p>
                <p style="margin: 4px 0; color: var(--text-muted);">Hali: <strong style="color: #16a34a;">Imethibitishwa</strong></p>
            </div>

            <button class="btn-main btn-logout" onclick="handleLogout()">Ondoka (Logout)</button>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const isRegistered = localStorage.getItem('mchezo_registered');
            if (isRegistered) {
                document.getElementById('signupSection').style.display = 'none';
                document.getElementById('loginSection').style.display = 'block';
                const sBtn = document.getElementById('toSignupBtn');
                if(sBtn) sBtn.style.display = 'none';
            }

            const savedUser = localStorage.getItem('mchezo_user');
            if (savedUser) {
                showProfile(JSON.parse(savedUser));
            }
        });

        function showLogin() {
            document.getElementById('signupSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        function showSignup() {
            document.getElementById('signupSection').style.display = 'block';
            document.getElementById('loginSection').style.display = 'none';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const msgBox = document.getElementById('signupMsg');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phone, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    msgBox.className = 'alert-box alert-success';
                    msgBox.innerText = data.message;
                    localStorage.setItem('mchezo_registered', 'true');
                    setTimeout(() => {
                        showLogin();
                        const sBtn = document.getElementById('toSignupBtn');
                        if(sBtn) sBtn.style.display = 'none';
                    }, 2000);
                } else {
                    msgBox.className = 'alert-box alert-error';
                    msgBox.innerText = data.message;
                }
            } catch (err) {
                msgBox.className = 'alert-box alert-error';
                msgBox.innerText = 'Hitilafu ya mtandao.';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value;
            const password = document.getElementById('loginPassword').value;
            const msgBox = document.getElementById('loginMsg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('mchezo_user', JSON.stringify(data.user));
                    showProfile(data.user);
                } else {
                    msgBox.className = 'alert-box alert-error';
                    msgBox.innerText = data.message;
                }
            } catch (err) {
                msgBox.className = 'alert-box alert-error';
                msgBox.innerText = 'Hitilafu imetokea wakati wa kuingia.';
            }
        }

        function showProfile(user) {
            document.getElementById('signupSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('profileSection').style.display = 'block';

            document.getElementById('profName').innerText = user.fullName;
            document.getElementById('profPhone').innerText = user.phone;
            document.getElementById('profMemberNumber').innerText = user.memberNumber;
            
            const initials = user.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('userAvatar').innerText = initials;
        }

        function handleLogout() {
            localStorage.removeItem('mchezo_user');
            location.reload();
        }
    </script>
</body>
</html>
