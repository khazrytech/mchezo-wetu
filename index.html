<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Fintech Platform</title>
    <style>
        :root {
            --bg-deep: #020617;
            --card-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.1);
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.4);
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.22) 0%, transparent 65%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.15) 0%, transparent 55%);
            color: var(--text-main);
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; overflow-x: hidden;
        }
        .portal-card {
            background: var(--card-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%; max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        .pro-emblem {
            width: 64px; height: 64px; margin: 0 auto 16px auto;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(16, 185, 129, 0.25));
            border: 1px solid rgba(59, 130, 246, 0.4);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.3);
        }

        .input-group { margin-bottom: 18px; }
        .input-label {
            font-size: 11px; font-weight: 800; color: var(--text-muted);
            letter-spacing: 0.6px; margin-bottom: 8px; display: block;
            text-transform: uppercase;
        }
        .input-field {
            width: 100%; padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 16px; color: #fff;
            font-size: 14px; outline: none; transition: all 0.25s ease;
        }
        .input-field:focus { 
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-action {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; border-radius: 16px;
            font-size: 14px; font-weight: 800; cursor: pointer;
            margin-top: 12px; transition: all 0.2s ease;
            box-shadow: 0 8px 20px var(--primary-glow);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-action:disabled { opacity: 0.65; cursor: not-allowed; }

        .btn-spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .link-toggle {
            color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 20px;
        }
        .link-toggle a { color: #60a5fa; text-decoration: none; font-weight: 800; }

        /* ULTRA-MODERN WELCOME ANIMATION OVERLAY */
        #welcomeOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.94);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 9999; display: none; align-items: center; justify-content: center;
            padding: 24px; opacity: 0; transition: opacity 0.4s ease;
        }
        #welcomeOverlay.active { display: flex; opacity: 1; }

        .welcome-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 32px; padding: 36px 28px; text-align: center;
            max-width: 380px; width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popUp {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .welcome-ring {
            width: 80px; height: 80px; margin: 0 auto 20px auto;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.25);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
            100% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.5); }
        }

        .welcome-title { font-size: 22px; font-weight: 900; color: #fff; margin: 0 0 6px 0; }
        .welcome-subtitle { font-size: 13px; color: var(--text-muted); margin: 0 0 24px 0; }

        .progress-bar-wrap {
            width: 100%; height: 6px; background: rgba(255,255,255,0.08);
            border-radius: 10px; overflow: hidden; position: relative;
        }
        .progress-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #2563eb, #10b981);
            border-radius: 10px; transition: width 1.4s ease-in-out;
        }

        #notificationSheet {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
            background: rgba(15, 23, 42, 0.92); color: #fff; padding: 14px 22px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15); font-size: 13px; font-weight: 700;
            z-index: 3000; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; gap: 10px; pointer-events: none;
            max-width: 90%; width: max-content;
        }
        #notificationSheet.active { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="welcomeOverlay">
        <div class="welcome-card">
            <div class="welcome-ring">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2 class="welcome-title" id="welcomeUserText">Umekaribishwa!</h2>
            <p class="welcome-subtitle">Inaandaa Dashibodi Yako ya Kifedha...</p>
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="welcomeProgress"></div>
            </div>
        </div>
    </div>

    <div id="notificationSheet">
        <span id="notifIcon">ℹ️</span>
        <span id="notifText">Taarifa</span>
    </div>

    <div class="portal-card">
        <div class="pro-emblem">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="3"></rect>
                <line x1="2" y1="10" x2="22" y2="10"></line>
                <line x1="6" y1="15" x2="10" y2="15"></line>
            </svg>
        </div>

        <div style="text-align: center; margin-bottom: 24px;">
            <h2 id="portalTitle" style="font-size: 22px; font-weight: 900; margin: 0 0 6px 0; color: #fff;">Mchezo Wetu</h2>
            <p id="portalSub" style="font-size: 12px; color: var(--text-muted); margin: 0;">Ingia kwenye mfumo wa kifedha wa kikundi</p>
        </div>

        <form id="loginForm" onsubmit="handleUserLogin(event)">
            <div class="input-group">
                <label class="input-label">Namba ya Simu / Jina / Member No.</label>
                <input type="text" id="loginId" class="input-field" placeholder="Ingiza Simu, Jina au No. ya Mwanachama" required>
            </div>
            <div class="input-group">
                <label class="input-label">Nenosiri (Password)</label>
                <input type="password" id="loginPass" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btnLogin" class="btn-action">
                <span>Ingia Kwenye Akaunti ➔</span>
            </button>
            <div class="link-toggle">
                Huna akaunti? <a href="#" onclick="toggleMode('register')">Jisajili Hapa</a>
            </div>
        </form>

        <form id="registerForm" style="display: none;" onsubmit="handleUserRegister(event)">
            <div class="input-group">
                <label class="input-label">Jina Kamili</label>
                <input type="text" id="regName" class="input-field" placeholder="Mfano: Baraka Makoi" required>
            </div>
            <div class="input-group">
                <label class="input-label">Namba ya Simu</label>
                <input type="tel" id="regPhone" class="input-field" placeholder="07XXXXXXXX" required>
            </div>
            <div class="input-group">
                <label class="input-label">Barua Pepe (Hiari)</label>
                <input type="email" id="regEmail" class="input-field" placeholder="mwanachama@example.com">
            </div>
            <div class="input-group">
                <label class="input-label">Nenosiri (Password)</label>
                <input type="password" id="regPass" class="input-field" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btnReg" class="btn-action" style="background: linear-gradient(135deg, #10b981, #059669);">
                <span>Tuma Ombi la Usajili ➔</span>
            </button>
            <div class="link-toggle">
                Unayo akaunti? <a href="#" onclick="toggleMode('login')">Ingia Hapa</a>
            </div>
        </form>
    </div>

    <script>
        function showNotification(msg, type = 'info') {
            const sheet = document.getElementById('notificationSheet');
            const icon = document.getElementById('notifIcon');
            const text = document.getElementById('notifText');

            icon.innerText = type === 'success' ? '✅' : (type === 'error' ? '⚠️' : 'ℹ️');
            text.innerText = msg;

            sheet.classList.add('active');
            setTimeout(() => sheet.classList.remove('active'), 3200);
        }

        function toggleMode(mode) {
            if (mode === 'register') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                document.getElementById('portalTitle').innerText = 'Usajili wa Mwanachama';
                document.getElementById('portalSub').innerText = 'Fungua akaunti mpya ya kikundi';
            } else {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('portalTitle').innerText = 'Mchezo Wetu';
                document.getElementById('portalSub').innerText = 'Ingia kwenye mfumo wa kifedha wa kikundi';
            }
        }

        async function handleUserLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginId').value.trim();
            const password = document.getElementById('loginPass').value.trim();

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = `<div class="btn-spinner"></div> <span>Inathibitisha...</span>`;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('userSession', JSON.stringify(data.user));
                    
                    const userName = data.user.fullName || 'Mwanachama';
                    document.getElementById('welcomeUserText').innerText = `Umekaribishwa, ${userName}!`;
                    const overlay = document.getElementById('welcomeOverlay');
                    overlay.classList.add('active');

                    setTimeout(() => {
                        document.getElementById('welcomeProgress').style.width = '100%';
                    }, 50);

                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1500);
                } else {
                    showNotification(data.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<span>Ingia Kwenye Akaunti ➔</span>`;
                }
            } catch (err) {
                showNotification('Hitilafu kwenye muunganisho wa Seva.', 'error');
                btn.disabled = false;
                btn.innerHTML = `<span>Ingia Kwenye Akaunti ➔</span>`;
            }
        }

        async function handleUserRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPass').value.trim();

            const btn = document.getElementById('btnReg');
            btn.disabled = true;
            btn.innerHTML = `<div class="btn-spinner"></div> <span>Inatuma Ombi...</span>`;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phone, email, password })
                });

                const data = await res.json();

                if (data.success) {
                    showNotification(data.message, 'success');
                    setTimeout(() => toggleMode('login'), 2000);
                } else {
                    showNotification(data.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = `<span>Tuma Ombi la Usajili ➔</span>`;
                }
            } catch (err) {
                showNotification('Imeshindikana kukamilisha usajili.', 'error');
                btn.disabled = false;
                btn.innerHTML = `<span>Tuma Ombi la Usajili ➔</span>`;
            }
        }
    </script>
</body>
</html>
