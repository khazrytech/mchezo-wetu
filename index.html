<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Digital Contribution Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --text-main: #f9fafb;
            --text-sub: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.12) 0%, transparent 45%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .brand-logo { text-align: center; margin-bottom: 24px; }
        .logo-badge {
            width: 64px; height: 64px; background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 20px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 800; color: #fff; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        .brand-logo h1 { font-size: 26px; font-weight: 800; color: #fff; }
        .brand-logo p { font-size: 12px; color: #60a5fa; font-weight: 700; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px; }

        .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 14px; margin-bottom: 22px; }
        .tab-btn { background: none; border: none; padding: 10px; color: var(--text-sub); font-weight: 700; font-size: 13px; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-sub); margin-bottom: 6px; }
        .form-control {
            width: 100%; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border-color);
            padding: 14px 16px; border-radius: 14px; color: #fff; font-size: 15px; outline: none; transition: all 0.2s;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        .btn-submit {
            width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: #fff; border: none; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 15px;
            cursor: pointer; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4); margin-top: 10px;
        }
        .notice-box { margin-top: 16px; font-size: 12px; color: var(--text-sub); text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand-logo">
            <div class="logo-badge">MW</div>
            <h1>Mchezo Wetu</h1>
            <p>Digital Contribution Hub</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" id="tabLogin" onclick="switchMode('login')">Ingia</button>
            <button class="tab-btn" id="tabSignup" onclick="switchMode('signup')">Jisajili</button>
        </div>

        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label>Majina Kamili</label>
                <input type="text" id="fullName" class="form-control" placeholder="Juma Ally">
            </div>
            <div class="form-group">
                <label>Barua Pepe (Email)</label>
                <input type="email" id="email" class="form-control" placeholder="juma@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Nenosiri (Password)</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Ingia Kwenye Akaunti →</button>
        </form>

        <div class="notice-box" id="noticeText">
            Kumbuka: Akaunti mpya zinahitaji idhini (Approval) ya Admin kabla ya kuingia mfumo.
        </div>
    </div>

    <script>
        let mode = 'login';
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchMode(m) {
            mode = m;
            if (m === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                document.getElementById('nameGroup').style.display = 'none';
                document.getElementById('submitBtn').innerText = 'Ingia Kwenye Akaunti →';
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('nameGroup').style.display = 'block';
                document.getElementById('submitBtn').innerText = 'Jisajili Sasa →';
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (mode === 'signup') {
                const fullName = document.getElementById('fullName').value.trim();
                if (!fullName) { alert('Weka jina lako kamili.'); return; }
                
                const { data, error } = await supabase.auth.signUp({
                    email, password, options: { data: { full_name: fullName } }
                });
                if (error) alert(error.message);
                else {
                    alert('Usajili umefanikiwa! Tafadhali subiri Admin akupitishe (Approve) ndipo uingie.');
                    switchMode('login');
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('Kuingia kimeshindikana: ' + error.message);
                } else {
                    localStorage.setItem('token', data.session.access_token);
                    // Angalia kama ameruhusiwa
                    const res = await fetch('/api/user/me', {
                        headers: { 'Authorization': 'Bearer ' + data.session.access_token }
                    });
                    if (res.ok) {
                        window.location.href = 'dashboard.html';
                    } else {
                        const errData = await res.json();
                        alert(errData.error || 'Akaunti yako bado haijaruhusiwa au imefungwa.');
                        supabase.auth.signOut();
                    }
                }
            }
        });
    </script>
</body>
</html>
