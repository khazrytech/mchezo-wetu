<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Fintech Platform</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #10b981;
            --accent-hover: #059669;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            margin: 16px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 24px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .switch-btn {
            background: none;
            color: var(--accent);
            border: none;
            margin-top: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: 600;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            text-align: center;
        }
        .message.error { background: #fee2e2; color: #991b1b; }
        .message.success { background: #d1fae5; color: #065f46; }
        
        .profile-card {
            text-align: center;
        }
        .avatar-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px auto;
            background: #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
        }
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: #2563eb;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 8px;
            border: 1px solid #bfdbfe;
        }
        .member-number-box {
            background: #f1f5f9;
            padding: 14px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 15px;
        }
        .logout-btn {
            background-color: #ef4444;
            margin-top: 16px;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container" id="appContainer">
        <!-- Fomu ya Usajili (Sign Up) -->
        <div id="signupSection">
            <h2>Jiunge na Mchezo Wetu</h2>
            <div id="signupMsg"></div>
            <form id="signupForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Jina Kamili</label>
                    <input type="text" id="regName" required placeholder="Weka jina lako kamili">
                </div>
                <div class="form-group">
                    <label>Namba ya Simu</label>
                    <input type="tel" id="regPhone" required placeholder="07xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>Barua Pepe (Hiari)</label>
                    <input type="email" id="regEmail" placeholder="mkononi@example.com">
                </div>
                <div class="form-group">
                    <label>Neno la Siri (Password)</label>
                    <input type="password" id="regPassword" required placeholder="Weka neno la siri">
                </div>
                <button type="submit">Jisajili Sasa</button>
            </form>
            <button class="switch-btn" onclick="showLogin()">Una akaunti? Ingia (Sign In)</button>
        </div>

        <!-- Fomu ya Kuingia (Sign In) -->
        <div id="loginSection" style="display: none;">
            <h2>Ingia kwenye Mfumo</h2>
            <div id="loginMsg"></div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Namba ya Simu</label>
                    <input type="tel" id="loginPhone" required placeholder="07xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>Neno la Siri (Password)</label>
                    <input type="password" id="loginPassword" required placeholder="Weka neno la siri">
                </div>
                <button type="submit">Ingia (Sign In)</button>
            </form>
            <button class="switch-btn" id="switchToSignupBtn" onclick="showSignup()">Haujasajiliwa? Jisajili</button>
        </div>

        <!-- Profaili ya Mwanachama aliyekubaliwa (Approved) -->
        <div id="profileSection" style="display: none;" class="profile-card">
            <div class="avatar-container" id="userAvatar">MW</div>
            <h2 id="profName" style="margin-bottom: 4px;">Jina la Mwanachama</h2>
            
            <div>
                <span class="verified-badge">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="#2563eb"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    Verified Member
                </span>
            </div>

            <div class="member-number-box">
                Namba ya Uanachama: <br>
                <span id="profMemberNumber" style="font-size: 18px; color: var(--accent); font-weight: bold;"></span>
            </div>

            <div style="text-align: left; background: #f8fafc; padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;">
                <p style="margin: 6px 0;"><strong>Simu:</strong> <span id="profPhone"></span></p>
                <p style="margin: 6px 0;"><strong>Hali:</strong> <span style="color: var(--accent); font-weight: bold;">Imethibitishwa (Active)</span></p>
            </div>

            <button class="logout-btn" onclick="handleLogout()">Ondoka (Logout)</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Kama mtumiaji alishajisajili kwenye kifaa hiki, fichua sehemu ya kujisajili iwe Sign In pekee
            const isRegistered = localStorage.getItem('mchezo_registered');
            if (isRegistered) {
                document.getElementById('signupSection').style.display = 'none';
                document.getElementById('loginSection').style.display = 'block';
                const switchBtn = document.getElementById('switchToSignupBtn');
                if(switchBtn) switchBtn.style.display = 'none';
            }

            // Kama yupo tayari ndani ya session
            const savedUser = localStorage.getItem('mchezo_user');
            if (savedUser) {
                showProfile(JSON.parse(savedUser));
            }
        });

        function showLogin() {
            document.getElementById('signupSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        function showSignup() {
            document.getElementById('signupSection').style.display = 'block';
            document.getElementById('loginSection').style.display = 'none';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const msgBox = document.getElementById('signupMsg');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, phone, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    msgBox.className = 'message success';
                    msgBox.innerText = data.message;
                    localStorage.setItem('mchezo_registered', 'true');
                    setTimeout(() => {
                        showLogin();
                        const switchBtn = document.getElementById('switchToSignupBtn');
                        if(switchBtn) switchBtn.style.display = 'none';
                    }, 2000);
                } else {
                    msgBox.className = 'message error';
                    msgBox.innerText = data.message;
                }
            } catch (err) {
                msgBox.className = 'message error';
                msgBox.innerText = 'Hitilafu imetokea. Jaribu tena.';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            const msgBox = document.getElementById('loginMsg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('mchezo_user', JSON.stringify(data.user));
                    showProfile(data.user);
                } else {
                    msgBox.className = 'message error';
                    msgBox.innerText = data.message;
                }
            } catch (err) {
                msgBox.className = 'message error';
                msgBox.innerText = 'Hitilafu imetokea wakati wa kuingia.';
            }
        }

        function showProfile(user) {
            document.getElementById('signupSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('profileSection').style.display = 'block';

            document.getElementById('profName').innerText = user.fullName;
            document.getElementById('profPhone').innerText = user.phone;
            document.getElementById('profMemberNumber').innerText = user.memberNumber;
            
            const initials = user.fullName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('userAvatar').innerText = initials;
        }

        function handleLogout() {
            localStorage.removeItem('mchezo_user');
            location.reload();
        }
    </script>
</body>
</html>
