<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Digital Contribution Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --card-glass: rgba(15, 23, 42, 0.82);
            --border-glass: rgba(255, 255, 255, 0.12);
            --cyan-glow: #06b6d4;
            --purple-glow: #a855f7;
            --blue-glow: #3b82f6;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 10% 30%, rgba(6, 182, 212, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 360px;
            pointer-events: none;
        }

        .custom-toast {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            color: #fff;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }

        .custom-toast.show { transform: translateY(0); opacity: 1; }
        .custom-toast.error { border-left: 4px solid #ef4444; }
        .custom-toast.success { border-left: 4px solid #10b981; }

        .auth-wrapper {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #a855f7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            padding: 3px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
        }

        .logo-inner {
            width: 100%;
            height: 100%;
            background: #030712;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: #06b6d4;
            letter-spacing: -1px;
        }

        .app-title { font-size: 28px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
        .app-subtitle { font-size: 12px; font-weight: 700; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .motto-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 600;
        }
        .motto-line::before, .motto-line::after { content: ''; width: 30px; height: 1px; background: rgba(255,255,255,0.2); }

        .auth-card {
            background: var(--card-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 26px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        /* Modern Simple Header - "Ingia" Only */
        .pro-header-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            margin-bottom: 22px;
            font-weight: 800;
            font-size: 15px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .input-group { margin-bottom: 16px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; font-size: 16px; color: var(--text-sub); }

        .custom-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 15px 16px 15px 46px;
            border-radius: 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        .custom-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

        .flex-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
            margin: 14px 0 20px;
        }

        .checkbox-label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .forgot-link { color: #38bdf8; text-decoration: none; font-weight: 600; }

        .btn-submit-glow {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit-glow:active { transform: scale(0.98); }

        .bottom-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-sub); }
        .bottom-switch a { color: #38bdf8; font-weight: 800; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="auth-wrapper">
        <div class="brand-header">
            <div class="logo-ring">
                <div class="logo-inner">MW</div>
            </div>
            <h1 class="app-title">Mchezo Wetu</h1>
            <div class="app-subtitle">Digital Contribution Hub</div>
            <div class="motto-line">Pamoja Tunajenga Kesho Bora</div>
        </div>

        <div class="auth-card">
            <div class="pro-header-tab" id="headerTitle">
                <span>👤</span> <span id="headerTitleText">Ingia</span>
            </div>

            <form id="authForm" novalidate autocomplete="on">
                <div class="input-group" id="nameGroup" style="display: none;">
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="fullName" class="custom-input" placeholder="Majina yako kamili" autocomplete="name">
                    </div>
                </div>

                <div class="input-group" id="phoneGroup" style="display: none;">
                    <div class="input-wrapper">
                        <span class="input-icon">📞</span>
                        <input type="tel" id="phone" class="custom-input" placeholder="Namba yako ya simu" autocomplete="tel">
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="identifier" class="custom-input" placeholder="Namba ya simu, Jina au Email" autocomplete="username" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="custom-input" placeholder="Nenosiri" autocomplete="current-password" required>
                    </div>
                </div>

                <div class="flex-options" id="optionsRow">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Kumbuka maelezo yangu</span>
                    </label>
                    <a href="javascript:void(0)" class="forgot-link" onclick="showToast('Wasiliana na Admin kubadilisha nenosiri.', 'error')">Sahau nenosiri?</a>
                </div>

                <button type="submit" class="btn-submit-glow" id="submitBtn">
                    <span id="btnText">Ingia</span> <span>→</span>
                </button>
            </form>

            <div class="bottom-switch">
                <span id="bottomQuestion">Huna akaunti?</span>
                <a id="bottomLink" onclick="toggleAuthMode()">Jisajili sasa</a>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (token) {
                try {
                    const res = await fetch("/api/user/me", {
                        headers: { "Authorization": "Bearer " + token }
                    });
                    if (res.ok) {
                        window.location.href = "dashboard.html";
                        return;
                    }
                } catch(e) { console.error(e); }
            }
        });

        let isSignUpMode = false;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            if (isSignUpMode) {
                document.getElementById('headerTitleText').innerText = 'Jisajili';
                document.getElementById('nameGroup').style.display = 'block';
                document.getElementById('phoneGroup').style.display = 'block';
                document.getElementById('optionsRow').style.display = 'none';
                document.getElementById('identifier').placeholder = 'Barua pepe (Email)';
                document.getElementById('btnText').innerText = 'Jisajili Sasa';
                document.getElementById('bottomQuestion').innerText = 'Unayo akaunti tayari?';
                document.getElementById('bottomLink').innerText = 'Ingia hapa';
            } else {
                document.getElementById('headerTitleText').innerText = 'Ingia';
                document.getElementById('nameGroup').style.display = 'none';
                document.getElementById('phoneGroup').style.display = 'none';
                document.getElementById('optionsRow').style.display = 'flex';
                document.getElementById('identifier').placeholder = 'Namba ya simu, Jina au Email';
                document.getElementById('btnText').innerText = 'Ingia';
                document.getElementById('bottomQuestion').innerText = 'Huna akaunti?';
                document.getElementById('bottomLink').innerText = 'Jisajili sasa';
            }
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;

            if (!identifier || !password) {
                showToast('Tafadhali jaza taarifa zote.', 'error');
                return;
            }

            if (isSignUpMode) {
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                if (!fullName) { showToast('Weka majina yako kamili.', 'error'); return; }

                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identifier, password, fullName, phone })
                });
                const data = await res.json();
                if (!res.ok) showToast(data.error || 'Usajili umeshindikana.', 'error');
                else {
                    showToast('Usajili umefanikiwa! Subiri Admin akuidhinishe kisha uingie.', 'success');
                    toggleAuthMode();
                }
            } else {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    showToast(data.error || 'Kuingia kimeshindikana. Hakiki taarifa zako.', 'error');
                } else {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
