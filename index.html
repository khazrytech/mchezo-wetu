<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mchezo Wetu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <nav class="bg-blue-600 text-white p-4 shadow-md">
    <div class="max-w-xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Mchezo Wetu</h1>
      <span class="text-xs bg-blue-700 px-2 py-1 rounded">Private Group</span>
    </div>
  </nav>

  <div class="max-w-xl mx-auto p-4 space-y-4">
    <div class="bg-white rounded-lg shadow p-5 border-l-4 border-blue-600">
      <h2 id="group-title" class="text-lg font-bold text-gray-700">Inapakia kikundi...</h2>
      <p class="text-sm text-gray-500">Mchango wa Kila Mwezi: <span id="target-amount" class="font-bold text-gray-800">Tsh 0</span></p>

      <div class="mt-4 bg-blue-50 p-3 rounded-lg flex justify-between items-center">
        <div>
          <p class="text-xs text-blue-600 font-semibold uppercase">Jumla Iliyokusanywa</p>
          <p id="total-collected" class="text-2xl font-extrabold text-blue-900">Tsh 0</p>
        </div>
        <button onclick="openPayModal()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg shadow text-sm">
          Lipa Mchango
        </button>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow p-5">
      <h3 class="text-md font-bold mb-3 border-b pb-2 text-gray-700">Hali ya Michango ya Wanachama</h3>
      <div id="members-list" class="space-y-3"></div>
    </div>
  </div>

  <div id="pay-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4">
    <div class="bg-white w-full max-w-sm rounded-lg p-6 shadow-xl relative">
      <h3 class="text-lg font-bold mb-2">Mchezo Wetu - STK Push</h3>
      <p class="text-xs text-gray-500 mb-4">Ingiza jina na namba ya simu. Mfumo unathibitisha na kuweka tiki papo hapo.</p>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold mb-1">Jina Lako Halisi</label>
          <input type="text" id="pay-name" placeholder="Mfano: Hassan Bakari Juma" class="w-full border p-2 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Namba ya Simu</label>
          <input type="text" id="pay-phone" placeholder="07XXXXXXXX" class="w-full border p-2 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Kiasi (Tsh)</label>
          <input type="number" id="pay-amount" value="20000" class="w-full border p-2 rounded text-sm bg-gray-50" readonly>
        </div>
      </div>

      <div class="mt-5 flex space-x-2">
        <button onclick="closePayModal()" class="w-1/2 bg-gray-300 hover:bg-gray-400 py-2 rounded text-sm font-semibold">Ghairi</button>
        <button onclick="submitStkPayment()" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-sm font-semibold">Tuma STK Push</button>
      </div>
    </div>
  </div>

  <script>
    const GROUP_ID = 'grp-101';

    async function loadDashboard() {
      try {
        const res = await fetch(`/api/dashboard/${GROUP_ID}`);
        const data = await res.json();

        document.getElementById('group-title').innerText = data.groupName;
        document.getElementById('target-amount').innerText = `Tsh ${data.targetContribution.toLocaleString()}`;
        document.getElementById('total-collected').innerText = `Tsh ${data.totalCollected.toLocaleString()}`;

        const listContainer = document.getElementById('members-list');
        listContainer.innerHTML = '';

        data.members.forEach(member => {
          const item = document.createElement('div');
          item.className = "flex justify-between items-center p-3 rounded-lg border";

          if (member.hasPaid) {
            item.classList.add('bg-green-50', 'border-green-200');
            item.innerHTML = `
              <div>
                <p class="font-bold text-sm text-gray-800">${member.name}</p>
                <p class="text-xs text-gray-500">${member.phone}</p>
              </div>
              <span class="text-xs font-bold bg-green-200 text-green-800 px-3 py-1 rounded-full flex items-center gap-1">
                ✔ Tsh ${member.amountPaid.toLocaleString()} (Kalipa)
              </span>
            `;
          } else {
            item.classList.add('bg-red-50', 'border-red-200');
            item.innerHTML = `
              <div>
                <p class="font-bold text-sm text-gray-800">${member.name}</p>
                <p class="text-xs text-gray-500">${member.phone}</p>
              </div>
              <span class="text-xs font-bold bg-red-200 text-red-800 px-3 py-1 rounded-full">
                ✖ Anadaiwa
              </span>
            `;
          }
          listContainer.appendChild(item);
        });
      } catch (err) {
        console.error("Error loading dashboard", err);
      }
    }

    function openPayModal() {
      document.getElementById('pay-modal').classList.remove('hidden');
    }

    function closePayModal() {
      document.getElementById('pay-modal').classList.add('hidden');
    }

    async function submitStkPayment() {
      const name = document.getElementById('pay-name').value;
      const phone = document.getElementById('pay-phone').value;
      const amount = document.getElementById('pay-amount').value;

      if (!name || !phone) {
        alert("Tafadhali jaza Jina na Namba ya Simu!");
        return;
      }

      const res = await fetch('/api/pay-stk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ groupId: GROUP_ID, memberName: name, phone: phone, amount: amount })
      });

      const result = await res.json();
      alert(result.message);
      closePayModal();
      loadDashboard();
    }

    loadDashboard();
  </script>
</body>
</html>
