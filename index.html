<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Mfumo Wazi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --surface: rgba(15, 23, 42, 0.85);
            --border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #fff; }
        p { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; }

        .btn-open {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            font-weight: 800;
            text-decoration: none;
            margin-bottom: 12px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mchezo Wetu Hub</h1>
        <p>Mfumo upo wazi bila vikwazo vya Login. Chagua sehemu unayotaka kwenda:</p>
        
        <a href="/dashboard" class="btn-open">Fungua Dashboard ya Wanachama</a>
        <a href="/admin" class="btn-open" style="background: linear-gradient(135deg, #9333ea, #ec4899);">Fungua Admin Panel</a>
    </div>
</body>
</html>
