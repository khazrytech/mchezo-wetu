<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mchezo Wetu - Digital Contribution Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --card-glass: rgba(15, 23, 42, 0.78);
            --border-glass: rgba(255, 255, 255, 0.12);
            --cyan-glow: #06b6d4;
            --purple-glow: #a855f7;
            --blue-glow: #3b82f6;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 10% 30%, rgba(6, 182, 212, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Effect */
        body::before {
            content: '';
            position: absolute;
            top: 2%;
            width: 280px;
            height: 280px;
            background: linear-gradient(135deg, #06b6d4, #a855f7);
            filter: blur(90px);
            opacity: 0.35;
            border-radius: 50%;
            z-index: 0;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }

        /* Logo Area matching Image */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #a855f7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            padding: 3px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
        }

        .logo-inner {
            width: 100%;
            height: 100%;
            background: #030712;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: #06b6d4;
            letter-spacing: -1px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .motto-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .motto-line::before, .motto-line::after {
            content: '';
            width: 30px;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        /* Glassmorphic Auth Box */
        .auth-card {
            background: var(--card-glass);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 26px 22px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }

        /* Toggle Tabs */
        .tab-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 22px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 13px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        /* Input Fields with Icons */
        .input-group {
            margin-bottom: 16px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            font-size: 16px;
            color: var(--text-sub);
        }

        .custom-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 15px 16px 15px 46px;
            border-radius: 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .custom-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        /* Checkbox & Forgot Password */
        .flex-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-sub);
            margin: 14px 0 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .forgot-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        /* Primary Blue/Purple Gradient Button */
        .btn-submit-glow {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit-glow:active {
            transform: scale(0.98);
        }

        .bottom-switch {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .bottom-switch a {
            color: #38bdf8;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <!-- Logo & Title Matching Image 1 -->
        <div class="brand-header">
            <div class="logo-ring">
                <div class="logo-inner">MW</div>
            </div>
            <h1 class="app-title">Mchezo Wetu</h1>
            <div class="app-subtitle">Digital Contribution Hub</div>
            <div class="motto-line">Pamoja Tunajenga Kesho Bora</div>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <div class="tab-switcher">
                <button class="tab-btn active" id="tabLogin" onclick="switchMode('login')">
                    <span>👤</span> Ingia
                </button>
                <button class="tab-btn" id="tabSignup" onclick="switchMode('signup')">
                    <span>👤+</span> Jisajili
                </button>
            </div>

            <form id="authForm" novalidate autocomplete="on">
                <!-- Name Group for Signup -->
                <div class="input-group" id="nameGroup" style="display: none;">
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="fullName" class="custom-input" placeholder="Majina yako kamili" autocomplete="name">
                    </div>
                </div>

                <!-- Phone Group for Signup -->
                <div class="input-group" id="phoneGroup" style="display: none;">
                    <div class="input-wrapper">
                        <span class="input-icon">📞</span>
                        <input type="tel" id="phone" class="custom-input" placeholder="Namba yako ya simu" autocomplete="tel">
                    </div>
                </div>

                <!-- Identifier Group -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="identifier" class="custom-input" placeholder="Namba ya simu au Barua pepe" autocomplete="username" required>
                    </div>
                </div>

                <!-- Password Group -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="custom-input" placeholder="Nenosiri" autocomplete="current-password" required>
                    </div>
                </div>

                <!-- Options Row -->
                <div class="flex-options" id="optionsRow">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Kumbuka maelezo yangu</span>
                    </label>
                    <a href="javascript:void(0)" class="forgot-link" onclick="alert('Wasiliana na Admin kubadilisha nenosiri.')">Sahau nenosiri?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit-glow" id="submitBtn">
                    <span>Ingia</span> <span>→</span>
                </button>
            </form>

            <div class="bottom-switch">
                <span id="bottomQuestion">Huna akaunti?</span>
                <a id="bottomLink" onclick="toggleMode()">Jisajili sasa</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (token) {
                try {
                    const res = await fetch("/api/user/me", {
                        headers: { "Authorization": "Bearer " + token }
                    });
                    if (res.ok) {
                        window.location.href = "dashboard.html";
                        return;
                    }
                } catch(e) {
                    console.error(e);
                }
            }
        });

        let currentMode = 'login';

        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                document.getElementById('nameGroup').style.display = 'none';
                document.getElementById('phoneGroup').style.display = 'none';
                document.getElementById('optionsRow').style.display = 'flex';
                document.getElementById('identifier').placeholder = 'Namba ya simu au Barua pepe';
                document.getElementById('submitBtn').innerHTML = '<span>Ingia</span> <span>→</span>';
                document.getElementById('bottomQuestion').innerText = 'Huna akaunti?';
                document.getElementById('bottomLink').innerText = 'Jisajili sasa';
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('nameGroup').style.display = 'block';
                document.getElementById('phoneGroup').style.display = 'block';
                document.getElementById('optionsRow').style.display = 'none';
                document.getElementById('identifier').placeholder = 'Barua pepe (Email)';
                document.getElementById('submitBtn').innerHTML = '<span>Jisajili Sasa</span> <span>→</span>';
                document.getElementById('bottomQuestion').innerText = 'Unayo akaunti tayari?';
                document.getElementById('bottomLink').innerText = 'Ingia hapa';
            }
        }

        function toggleMode() {
            switchMode(currentMode === 'login' ? 'signup' : 'login');
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;

            if (!identifier || !password) {
                alert('Tafadhali jaza taarifa zote zinazohitajika.');
                return;
            }

            if (currentMode === 'signup') {
                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                if (!fullName) { alert('Tafadhali weka majina yako kamili.'); return; }

                const res = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identifier, password, fullName, phone })
                });
                const data = await res.json();
                if (!res.ok) alert(data.error || 'Usajili umeshindikana.');
                else {
                    alert('Usajili umefanikiwa! Tafadhali subiri Admin akuidhinishe (Approve) kisha uingie.');
                    switchMode('login');
                }
            } else {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.error || 'Kuingia kimeshindikana. Hakiki nenosiri au namba/email yako.');
                } else {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
