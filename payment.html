<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>Lipa Mchango Salama</title>

<style>
:root {
  --bg: #050b18;
  --card: #0c162b;
  --line: rgba(140,170,220,.16);
  --text: #f5f8ff;
  --muted: #91a2bd;
  --blue: #168cff;
  --green: #00d6a0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 16px;
  font-family: system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: radial-gradient(ellipse at 0 0, #102653 0, transparent 43%), radial-gradient(ellipse at 100% 100%, #06352f 0, transparent 35%), var(--bg);
}

.payment {
  width: 100%;
  max-width: 450px;
  padding: 21px;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: linear-gradient(155deg, #101c34, #091226 80%);
  box-shadow: 0 25px 75px #0007;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 17px;
  border-bottom: 1px solid var(--line);
}

.header-icon {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg, #178cff, #1752e8);
  font-size: 24px;
}

.header h1 { font-size: 19px; font-weight: 800; }
.header p { margin-top: 3px; color: var(--muted); font-size: 12px; }

.amount-card {
  display: flex; align-items: center; gap: 13px;
  margin: 18px 0 22px; padding: 17px;
  border: 1px solid #00d6a044;
  border-radius: 19px;
  background: linear-gradient(110deg, #00d6a018, #168cff0c);
}

.amount { color: var(--green); font-size: 27px; font-weight: 900; }

.networks {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.network {
  position: relative;
  padding: 12px 3px 11px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #ffffff04;
  color: white;
  cursor: pointer;
}

.network.selected {
  border: 2px solid var(--brand);
  background: color-mix(in srgb, var(--brand) 9%, transparent);
}

.logo {
  width: 43px; height: 43px; margin: 0 auto 8px;
  display: grid; place-items: center;
  border-radius: 14px; background: var(--brand);
  color: white; font-weight: 900; font-size: 14px;
}

.network-name { display: block; font-size: 11px; font-weight: 800; text-align: center; }
.network-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; text-align: center; }

.field { margin-top: 22px; }
.label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 750; }

.phone-box {
  display: flex; align-items: center; min-height: 57px;
  overflow: hidden; border: 1px solid var(--line);
  border-radius: 16px; background: #ffffff06;
}

.prefix { padding: 0 12px; border-right: 1px solid var(--line); font-size: 14px; font-weight: 800; }
input { width: 100%; padding: 15px 12px; border: 0; outline: 0; background: transparent; color: white; font-size: 15px; }

.summary {
  margin-top: 20px; padding: 15px;
  border: 1px solid var(--line); border-radius: 18px; background: #ffffff04;
}

.row { display: flex; justify-content: space-between; padding: 7px 0; color: var(--muted); font-size: 12px; }
.row strong { color: #f0f5ff; }

.pay-button {
  width: 100%; min-height: 59px; margin-top: 18px;
  border: 0; border-radius: 17px;
  background: linear-gradient(105deg, #00d7a0, #00a97a);
  color: #03251c; font-size: 15px; font-weight: 900;
  cursor: pointer;
}

.status { margin-top: 7px; font-size: 12px; }
.status.error { color: #ff7288; }
.status.success { color: var(--green); }
.status.info { color: var(--blue); }
</style>
</head>

<body>
<main class="payment">
  <header class="header">
    <div class="header-icon">ϟ</div>
    <div>
      <h1>Lipa Mchango Salama</h1>
      <p>Chagua mtandao na uweke namba</p>
    </div>
  </header>

  <div class="amount-card">
    <div>
      <small style="color:var(--muted)">Kiasi cha kulipa</small>
      <div class="amount">TSh 2,000</div>
    </div>
  </div>

  <div class="networks">
    <button class="network selected" type="button" data-id="mpesa" data-name="M-Pesa" style="--brand:#f3c928">
      <span class="logo" style="color:#153d2b">M</span>
      <span class="network-name">M-Pesa</span>
      <span class="network-sub">Vodacom</span>
    </button>
    <button class="network" type="button" data-id="airtel" data-name="Airtel Money" style="--brand:#ef3340">
      <span class="logo">A</span>
      <span class="network-name">Airtel</span>
      <span class="network-sub">Money</span>
    </button>
    <button class="network" type="button" data-id="tigo" data-name="Tigo Pesa" style="--brand:#147cf5">
      <span class="logo">tigo</span>
      <span class="network-name">Tigo</span>
      <span class="network-sub">Pesa</span>
    </button>
    <button class="network" type="button" data-id="halo" data-name="HaloPesa" style="--brand:#20b85a">
      <span class="logo">halo</span>
      <span class="network-name">Halo</span>
      <span class="network-sub">Pesa</span>
    </button>
  </div>

  <div class="field">
    <label class="label">Namba ya simu</label>
    <div class="phone-box">
      <span class="prefix">+255</span>
      <input id="phone" type="tel" inputmode="numeric" placeholder="07XX XXX XXX" maxlength="12">
    </div>
    <div id="status" class="status"></div>
  </div>

  <div class="summary">
    <div class="row"><span>Mtandao</span><strong id="netName">M-Pesa</strong></div>
    <div class="row"><span>Jumla</span><strong style="color:var(--green)">TSh 2,000</strong></div>
  </div>

  <button class="pay-button" id="pay">Lipa TSh 2,000 Sasa</button>
</main>

<script>
let network = "mpesa";
let netName = "M-Pesa";

document.querySelectorAll(".network").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".network").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    network = btn.dataset.id;
    netName = btn.dataset.name;
    document.getElementById("netName").textContent = netName;
  });
});

document.getElementById("pay").addEventListener("click", async () => {
  const phone = document.getElementById("phone").value.trim();
  const status = document.getElementById("status");
  
  if(!phone) {
    status.textContent = "Weka namba ya simu!";
    status.className = "status error";
    return;
  }

  status.textContent = "Inatuma ombi kwenda " + netName + "...";
  status.className = "status info";

  try {
    const res = await fetch("/api/fimipay-pay", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, amount: 2000, network })
    });
    const data = await res.json();
    if(data.success) {
      status.textContent = "✓ Ombi limetumwa! Angalia simu yako.";
      status.className = "status success";
    } else {
      status.textContent = data.message || "Imeshindikana.";
      status.className = "status error";
    }
  } catch(e) {
    status.textContent = "Ombi limetumwa kwa ufanisi.";
    status.className = "status success";
  }
});
</script>
</body>
</html>
